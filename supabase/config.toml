# Configuracao minima, so o que o deploy da edge function precisa. O resto dos
# defaults da CLI serve -- este repo nao roda stack local (nao ha `supabase start`).
project_id = "matgynpiscyoshnjzolo"

# Declarado de proposito, nao por depender do default: se `verify_jwt` virasse
# false num deploy, a funcao passaria a aceitar chamada de qualquer um sem
# token, e ela escreve na tabela `sessoes` com a service_role key. A doc
# recomenda fixar aqui justamente para o valor nao variar entre deploys.
[functions.sync-google-calendar]
verify_jwt = true

# Mesmo motivo: grava em `stlseller_mentorados` com a service_role key.
[functions.sync-stlseller]
verify_jwt = true

# Mesmo motivo: grava em `experiencia_respostas` com a service_role key.
[functions.sync-experiencia]
verify_jwt = true

# Mesmo motivo: grava em `nps_analises` e gasta a chave da Anthropic a cada chamada.
[functions.nps-analista]
verify_jwt = true

# Mesmo motivo: grava em `transcricoes`/`mentorado_dossies` e gasta Jev e Anthropic a cada chamada.
[functions.sync-transcricoes]
verify_jwt = true

# Mesmo motivo: grava em `transcricoes` com a service_role key.
[functions.buscar-transcricoes]
verify_jwt = true

# Mesmo motivo: cria, altera e exclui usuários do Auth com a service_role key. Além do JWT
# válido, a função confere `profiles.role = 'admin'` (AD-011).
[functions.admin-usuarios]
verify_jwt = true
