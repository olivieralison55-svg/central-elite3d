  $("#app").innerHTML = `
  <div class="topbar"><div><h2>Rotas</h2><div class="sub">Marcos, canais e faturamento por rota</div></div>
  <div class="rowflex">
    <select style="width:auto;min-width:180px" onchange="rotaAtual=this.value;canalAtual=null;render()">${ROTAS.map(r=>`<option value="${r.slug}" ${r.slug===rota.slug?"selected":""}>${esc(r.nome)}</option>`).join("")}</select>
    ${btnNovoMentorado(true)}
  </div></div>

  ${temMultiplosCanais?`
  <div class="panel" style="padding:14px 16px">
    <div class="rowflex" style="justify-content:space-between;cursor:pointer" onclick="canaisAbertos=!canaisAbertos;renderRotas()">
      <h3 style="margin:0">Canal de ${esc(rota.nome)} · ${esc(canalObj?canalObj.nome:"—")}</h3>
      <span class="arrow">${canaisAbertos?"▲":"▼"}</span>
    </div>
    ${canaisAbertos?`<div class="rowflex mt8">${canaisDaRota.map(c=>`<button class="btn sm ${c.id===canalAtual?"":"ghost"}" onclick="canalAtual='${c.id}';canaisAbertos=false;renderRotas()">${esc(c.nome)}</button>`).join("")}</div>`:''}
  </div>`:''}

    :`<div class="empty">Marcos desta rota ainda não foram definidos.</div>`}
  </div>

    </div>

      <span class="section-label" style="margin:0">Canal de venda deste mentorado:</span>

      ${pode("escreverRotas")?`<button class="btn sm ghost" onclick="salvarCanalMentorado('${sel}','${rota.id}')">Salvar</button>`:""}
    </div>`:''}
    ${marcosDoSel.length?`<div class="stepper">${marcosDoSel.map(({marco,mm},i)=>{
      const st = mm?mm.status:(rota.modelo==="simples"?"nao_passou":"NAO_INICIADO");
      const done = st==="passou" || st==="CONCLUIDO";
      const atual = !done && (st==="EM_ANDAMENTO" || st==="AGUARDANDO_VALIDACAO" || st==="BLOQUEADO");
      const aberto = marcoAberto===marco.id;
      const cls = `${done?"done":atual?"atual":"futuro"}${aberto?" aberto":""}`;
      const ultimo = i===marcosDoSel.length-1;
      const pr = progressoMarco(marco, mm);
      return `<div class="step ${cls} ${ultimo?"last":""}">
        <div class="step-mark" aria-hidden="true">${done?"✓":atual?"●":""}</div>
        <button type="button" class="step-head" aria-expanded="${aberto?"true":"false"}" onclick="toggleMarco('${marco.id}')">

  </div>

  <div class="panel" style="overflow-x:auto"><h3>Registros</h3>

  if(marcos.length && window.Chart){

    });

  if(canalObj && sel && window.Chart){

      options:{ responsive:true, maintainAspectRatio:false,
        /* eixo em real cheio (R$ 1.000,00), mesmo padrão do tooltip e dos cards */
        scales:chartScales({callback:v=>fmtBRL(v)}),
        plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>fmtBRL(c.raw)}}} }

}

/* Abrir um marco fecha o anterior: dois painéis abertos duplicariam os ids
   mk_status / mk_data e o Salvar leria o campo do marco errado. */
window.toggleMarco = function(marcoId){
  marcoAberto = (marcoAberto === marcoId) ? null : marcoId;
  renderRotas();
}
/* Contador e barra do teste de passagem, sem re-render: re-renderizar a cada
   clique fecharia o calendário e jogaria fora o que ainda não foi salvo. */
window.atualizarProgressoMarco = function(){
  const cbs = [...document.querySelectorAll(".mk-crit")];
  const ok = cbs.filter(c=>c.checked).length;
  const cont = document.getElementById("mk_contador");
  if(cont) cont.textContent = `${ok} de ${cbs.length}`;
  const barra = document.querySelector("#mk_barra i");
  if(barra) barra.style.width = (cbs.length ? Math.round(ok/cbs.length*100) : 0) + "%";
}
window.salvarMarco = async function(marcoId, mentoradoId){
  const rota = ROTAS.find(r=>r.slug===rotaAtual);
  const isSimples = rota.modelo==="simples";
  const payload = {
    mentorado_id: mentoradoId, marco_id: marcoId,
    status: $("#mk_status").value,
    data: $("#mk_data").value || null,
  };
  if(!isSimples){
    /* Progresso e critérios pendentes são derivados do teste de passagem: não
       existe campo manual para eles discordarem do que está marcado. */
    const cbs = [...document.querySelectorAll(".mk-crit")];
    payload.criterios_ok = cbs.filter(c=>c.checked).map(c=>c.value);
    payload.criterios_pendentes = cbs.filter(c=>!c.checked).map(c=>c.value);
    payload.progresso = cbs.length ? Math.round(payload.criterios_ok.length/cbs.length*100) : null;
    payload.bloqueios = $("#mk_bloq").value.split("\n").map(s=>s.trim()).filter(Boolean);
    payload.proxima_acao = $("#mk_acao").value.trim() || null;
  }
  const {error} = await db.from("mentorado_marcos").upsert(payload, {onConflict:"mentorado_id,marco_id"});
  if(error) return toast(error.message,true);
  toast("Evolução registrada"); await loadAll(); rotaMentoradoId=mentoradoId; marcoAberto=marcoId; renderRotas();
}

/* ================= ANÁLISE (STLSeller) ================= */
/* Visão analítica dos mentorados a partir das tabelas stlseller_*: quanto a
   carteira vende nos marketplaces, quem concentra o faturamento, quem ainda
   não vendeu e onde o cruzamento por e-mail falha. Mesmo recorte de papel da
   aba STLSeller da ficha — tem faturamento e status de pagamento.

   "Bruto" vem dos pedidos (já sem cancelados); "receita por anúncio" vem dos
   produtos. A cobertura é uma sobre a outra: abaixo de 100% é venda que não
   foi atribuída a anúncio nenhum. */
const MKT_ROTULO = {mercadolivre:"Mercado Livre", shopee:"Shopee"};
const ANALISE_STATUS = [["ATIVO","Ativos"],["PAUSADO","Pausados"],["CANCELADO","Cancelados"],["","Todos"]];
const ANALISE_FILTROS = [["todos","Todos"],["vende","Vendendo"],["parado","Sem venda"],["plano","Plano ativo"],
  ["fora","Anúncio fora do catálogo"],["email","E-mail incorreto"]];
/* E-mail do mentorado. Quando o formulário traz o e-mail STLFLIX, é ele que se
   tenta primeiro (o n8n também prefere a loja achada por ele). Só conta como
   resolvido se o e-mail STLFLIX de fato encontra a conta de seller; o resto
   fica marcado como não cadastrado corretamente, com o motivo. */
function situacaoEmail(r){
  const stl = normalizaEmail(r.email_stlflix), loja = normalizaEmail(r.loja_email);
  if(stl && stl===r.email) return {ok:true};
  if(stl && loja===stl) return {ok:true, resolvidoPorStlflix:true};
  if(!stl) return {ok:false, motivo:"Formulário sem e-mail STLFLIX"};
  return {ok:false, motivo: loja ? "E-mail STLFLIX não é o da loja" : "E-mail STLFLIX não encontra conta de seller"};
}

/* Uma linha por mentorado do STLSeller, já com os números somados. */
function linhasAnalise(){
  const pedPor = new Map(), prodPor = new Map();
  for(const o of STL_PEDIDOS){ if(!pedPor.has(o.email)) pedPor.set(o.email, []); pedPor.get(o.email).push(o); }
  for(const p of STL_PRODUTOS){ if(!prodPor.has(p.email)) prodPor.set(p.email, []); prodPor.get(p.email).push(p); }
  const soma = (xs, f) => xs.reduce((a,x)=>a+(Number(x[f])||0), 0);
  return STLSELLER.map(r=>{
    const ped = pedPor.get(r.email)||[], prod = prodPor.get(r.email)||[];
    const pedidos = soma(ped,"pedidos"), cancelados = soma(ped,"pedidos_cancelados");
    const bruto = soma(ped,"total_bruto"), receita = soma(prod,"faturamento");
    const ultimo = ped.map(o=>o.ultimo_pedido_em).filter(Boolean).sort().pop() || null;
    const situacao = !r.loja_id ? "sem-conta" : (pedidos>0 || prod.length>0) ? "vende" : "parado";
    const ficha = M.find(m=>{ const e = normalizaEmail(m.email); return e && (e===r.email || e===normalizaEmail(r.email_stlflix)); });
    return {r, ficha, situacao, pedidos, cancelados, bruto, receita, ultimo,
      pctCancel: pedidos ? cancelados/pedidos : null,
      cobertura: bruto ? receita/bruto : null,
      anuncios: prod.length, fora: prod.filter(p=>p.cadastrado_no_stlseller===false).length,
      canais: [...new Set(ped.map(o=>o.marketplace))].sort(),
      email: situacaoEmail(r), prod};
  });
}
const pct = v => v==null ? "—" : (v*100).toLocaleString("pt-BR",{maximumFractionDigits:1})+"%";
const nomeAnalise = l => l.ficha ? l.ficha.nome : (l.r.nome || l.r.email);
function linkFichaAnalise(l){
  const nomeTxt = esc(nomeAnalise(l));
  return l.ficha ? `<a class="lk-nome" onclick="openMentorado('${l.ficha.id}','stlseller')">${nomeTxt}</a>` : nomeTxt;
}
window.setAnalise = function(campo, v){ filtro[campo] = v; render(); };

  lista = applySort(lista, "analise", {

    <div class="sub">Como os mentorados vendem nos marketplaces. <span class="pill blue">Dados do STLSeller</span>
      ${sync?` atualizado em ${fmtInstante(sync)}`:""}</div></div></div>

  ${STLSELLER_ERRO?`<div class="panel"><div class="empty">Não foi possível carregar os dados do STLSeller: ${esc(STLSELLER_ERRO)}</div></div>`:`
  <div class="rowflex" style="margin-bottom:18px">${ANALISE_STATUS.map(([v,rot])=>
    `<button class="btn sm${v===status?"":" ghost"}" aria-pressed="${v===status}" onclick="setAnalise('statusAnalise','${v}')">${rot} &middot; ${STLSELLER.filter(r=>!v||r.status_formulario===v).length}</button>`).join("")}</div>

    <div class="card"><div class="k">Atribuído a anúncios</div><div class="v">${fmtBRL(receita)}</div><div class="d">${pct(bruto?receita/bruto:null)} do bruto</div></div>
    <div class="card"><div class="k">Pedidos</div><div class="v">${pedidos.toLocaleString("pt-BR")}</div><div class="d">${pct(pedidos?cancelados/pedidos:null)} cancelados (${cancelados.toLocaleString("pt-BR")})</div></div>

      `<button class="btn sm${v===chip?"":" ghost"}" aria-pressed="${v===chip}" onclick="setAnalise('chipAnalise','${v}')">${rot}</button>`).join("")}</div>
    <div class="tw"><table><thead><tr>
      ${th("analise","nome","Mentorado")}${th("analise","status","Status real")}${th("analise","plano","Plano")}<th>Canais</th>
      ${th("analise","pedidos","Pedidos","num")}${th("analise","cancel","% cancel.","num")}${th("analise","bruto","Bruto","num")}
      ${th("analise","receita","Por anúncio","num")}${th("analise","cobertura","Cobertura","num")}${th("analise","anuncios","Anúncios","num")}
      ${th("analise","fora","Fora do catálogo","num")}${th("analise","ultimo","Último pedido")}
    </tr></thead><tbody>
    ${lista.map(l=>{ const [cor,rot] = STATUS_REAL[l.r.status_real]||["gray",l.r.status_real||"—"]; const vende = l.situacao==="vende";
      return `<tr${vende?"":' class="an-zero"'}>
      <td>${linkFichaAnalise(l)}<div class="hint">${esc(l.r.loja_nome||l.r.email)}</div></td>
      <td><span class="pill ${cor}">${esc(rot)}</span></td>
      <td>${l.situacao==="sem-conta"?'<span class="pill amber">sem conta</span>':l.r.plano_ativo?'<span class="pill green">ativo</span>':'<span class="pill gray">inativo</span>'}</td>
      <td>${l.canais.map(c=>esc(MKT_ROTULO[c]||c)).join(", ")||"—"}</td>
      <td class="num">${vende?l.pedidos.toLocaleString("pt-BR"):"—"}</td>

      <td class="num">${vende?fmtBRL(l.receita):"—"}</td>

      <td class="num">${l.fora||"—"}</td>
      <td>${l.ultimo?fmtInstante(l.ultimo):"—"}</td></tr>`; }).join("")
      || `<tr><td colspan="12"><div class="empty">Ninguém neste recorte.</div></td></tr>`}
    </tbody></table></div></div>

  <div class="panel"><h3>Os 15 anúncios que mais faturam</h3>

    </table></div>`:`<div class="empty" style="padding:12px">Ninguém neste recorte.</div>`}</div>`}`;
}

/* ================= FICHA DO MENTORADO ================= */
/* A ficha é uma página com endereço próprio — `#/mentorado/<id>/<aba>` — e não
   mais um overlay. Link colado no WhatsApp abre a ficha certa, F5 em cima dela
   volta nela, e o voltar do navegador sai dela.

   As abas são os três recortes que a ficha já servia conforme a tela de origem:
   "cadastro"   -> nome, datas, links e situação
   "financeiro" -> contrato, pagamento e parcelas
   "sessoes"    -> a trilha de 12 etapas e os encontros em grupo
   "stlseller"  -> o que o STLSeller sabe da pessoa (loja, vendas, status real)
   Quem clica numa parcela vencida no Financeiro cai direto na aba Financeiro;
   antes isso era o parâmetro `secao`, e continua sendo — agora ele vira URL. */
const ABAS_FICHA = ["cadastro","financeiro","sessoes","stlseller"];
const ABA_DE_SECAO = {completo:"cadastro", basico:"cadastro", cadastro:"cadastro",
                      financeiro:"financeiro", sessoes:"sessoes", stlseller:"stlseller"};
const ROTULO_ABA = {cadastro:"Cadastro", financeiro:"Financeiro", sessoes:"Sessões", stlseller:"STLSeller"};
/* Abas que carregam dinheiro ou status de pagamento: fechadas por papel. */
const ABAS_FINANCEIRAS = ["financeiro","stlseller"];

/* O nome fica: 25 pontos da interface chamam `openMentorado`. O que mudou é o
   efeito — em vez de abrir overlay, troca o endereço e o roteador desenha.
   Sem `secao` (é o caso de quem volta de um submodal) a aba atual é mantida. */
window.openMentorado = function(id, secao){
  const aba = secao ? (ABA_DE_SECAO[secao] || "cadastro")
                    : (fichaId===id ? fichaAba : "cadastro");
  irPara(`#/mentorado/${encodeURIComponent(id)}${aba==="cadastro"?"":"/"+aba}`);
};

/* ---- Aba STLSeller ----
   Tudo aqui vem do STLSeller (a plataforma de vendas) e do formulário da
   mentoria, lidos no BigQuery pelo n8n e gravados nas tabelas stlseller_*
   pelo sync-stlseller. Somente leitura: nada nesta aba escreve em lugar nenhum,
   e o que diverge da ficha se corrige na origem, não aqui.

   O casamento é pelo e-mail da ficha contra o e-mail do formulário ou o da
   conta STLFLIX — os dois existem porque muita gente usa um endereço na
   mentoria e outro na loja. */
function stlsellerDe(m){
  const e = normalizaEmail(m.email);
  if(!e) return null;
  return STLSELLER.find(r => r.email===e) || STLSELLER.find(r => normalizaEmail(r.email_stlflix)===e) || null;
}
// Instante do STLSeller/Lia em horário de Brasília; valor inválido vira "—".
function fmtInstante(v){
  const d = v ? new Date(v) : null;
  if(!d || isNaN(d.getTime()) || d.getTime()<=0) return "—";
  return d.toLocaleString("pt-BR",{timeZone:"America/Sao_Paulo", dateStyle:"short", timeStyle:"short"});
}
const numOuTraco = v => (v===null || v===undefined || v==="") ? "—" : Number(v).toLocaleString("pt-BR");
// Nulo é "o marketplace não informou" (o Mercado Livre não manda o líquido), não zero.
const brlOuTraco = v => (v===null || v===undefined || v==="") ? "—" : fmtBRL(Number(v));
const STATUS_REAL = {
  pago:["green","Pago"], pendente:["amber","Pagamento pendente"],
  inadimplente_ou_cancelado:["red","Inadimplente ou cancelado"], sem_pedido_lia:["gray","Sem pedido na Lia"],
};

const MAX_PRODUTOS = 50;

window.salvarMentorado = async function(id){
  // A ficha pode estar num recorte parcial, então só envia os campos presentes na tela.
  const upd = {};
  const val = s => { const el = $(s); return el ? el.value : undefined; };
  const nomeV = val("#e_nome");
  if(nomeV !== undefined){
    if(!nomeV.trim()) return toast("Informe o nome", true);
    upd.nome = nomeV.trim();
    /* Salvar a ficha é o ato de alguém olhar o cadastro e responder por ele —
       é o que tira a marca de incompleto que a Lia colocou ao criar. Só vale
       quando o bloco básico está na tela; num recorte parcial não houve
       revisão de cadastro nenhuma. */
    upd.cadastro_incompleto = false;
  }
  /* E-mail é a chave que o sync usa para casar o evento do Calendar com a
     ficha, e o unico do banco e em lower(). Gravar com espaco ou caixa alta
     passaria no unico e nao casaria com o convidado do evento. */
  const emailV = val("#e_email");
  if(emailV !== undefined) upd.email = normalizaEmail(emailV);

  const mapa = {
    "#e_fech":"data_fechamento", "#e_contr":"contrato_status",
    "#e_ent":"entrada_status", "#e_entf":"entrada_forma_pgto",
    "#e_res":"restante_status", "#e_resf":"restante_forma_pgto",
    "#e_ldrive":"link_drive", "#e_lmapa":"link_mapa_mental", "#e_lwhats":"link_whatsapp",
  };
  for(const [sel,campo] of Object.entries(mapa)){
    const v = val(sel);
    if(v !== undefined) upd[campo] = v || null;
  }
  if(!Object.keys(upd).length) return;
  const {error} = await db.from("mentorados").update(upd).eq("id",id);
  if(error) return toast(msgErroMentorado(error),true);

  /* Preencher ou corrigir o e-mail pode destravar cobrança que chegou antes do
     cadastro. Quem salva não sabe que havia algo parado, então a adoção é
     automática — e avisa, porque o financeiro da ficha muda junto. */
  let adotadas = 0;
  if(upd.email !== undefined){
    const {data} = await db.rpc("lia_adotar_orfas", {p_mentorado: id});
    adotadas = data || 0;
  }
  toast(adotadas
    ? `Mentorado atualizado · ${adotadas} cobrança(s) da Lia vinculada(s)`
    : "Mentorado atualizado");
  closeModal(); loadAll();
}
/* Vincula à mão uma cobrança órfã. O reflexo no financeiro vem da mesma função
   do banco que o webhook usa — duas implementações da mesma regra divergiriam
   na primeira vez que alguém mexesse numa só. */
window.vincularCobranca = async function(billId, mentoradoId){
  const {error} = await db.from("lia_cobrancas")
    .update({mentorado_id: mentoradoId}).eq("lia_bill_id", billId);
  if(error) return toast(error.message, true);
  const {error: e2} = await db.rpc("lia_refletir_financeiro", {p_mentorado: mentoradoId});
  if(e2) return toast(e2.message, true);
  toast(`Cobrança vinculada a ${nome(mentoradoId)}`);
  await loadAll();
}
/* Descartar em vez de apagar. Apagar a linha não resolveria: o próximo webhook
   da mesma fatura a recriaria, e o alerta voltaria sozinho. Marcada, ela some
   da conta e do financeiro, mas continua guardada — e volta com um clique. */
window.descartarCobranca = async function(billId){
  const {error} = await db.from("lia_cobrancas").update({ignorada:true}).eq("lia_bill_id", billId);
  if(error) return toast(error.message, true);
  /* Se a cobrança estava vinculada, o financeiro daquele mentorado muda: a
     parcela dela tem que sair da ficha. */
  const c = COBRANCAS.find(x=>x.lia_bill_id===billId);
  if(c && c.mentorado_id) await db.rpc("lia_refletir_financeiro", {p_mentorado: c.mentorado_id});
  toast("Cobrança descartada"); await loadAll();
}
window.restaurarCobranca = async function(billId){
  const {error} = await db.from("lia_cobrancas").update({ignorada:false}).eq("lia_bill_id", billId);
  if(error) return toast(error.message, true);
  const c = COBRANCAS.find(x=>x.lia_bill_id===billId);
  if(c && c.mentorado_id) await db.rpc("lia_refletir_financeiro", {p_mentorado: c.mentorado_id});
  toast("Cobrança restaurada"); await loadAll();
}

window.salvarParcela = async function(pid, mid){
  const num = parseInt($("#p_num").value,10);
  if(!num || num<1) return toast("Numero de parcela invalido",true);
  const dup = parcelasDe(mid).find(x=>x.numero===num && x.id!==pid);
  if(dup) return toast("Ja existe a parcela #"+num+" deste mentorado",true);
  const valorRaw = $("#p_valor").value;
  const upd = { numero:num, vencimento: $("#p_venc").value||null,
    valor: valorRaw!==""?parseFloat(valorRaw):null, status: $("#p_status").value };
  const {error} = await db.from("parcelas").update(upd).eq("id",pid);
  if(error) return toast(error.message,true);
  toast("Parcela atualizada"); await loadAll(); openMentorado(mid);
}
window.delParcela = async function(pid, mid){
  if(!confirm("Excluir esta parcela? A acao nao pode ser desfeita.")) return;
  const {error} = await db.from("parcelas").delete().eq("id",pid);
  if(error) return toast(error.message,true);
  toast("Parcela excluida"); await loadAll(); openMentorado(mid);
}

  const sugestao = ETAPAS.find(e=>!usadas.has(e)) || "Checkup extra";
  /* Etapa fora das listas conhecidas (registro antigo) vira opção própria:
     sem isso o select cai na primeira opção e salvar trocaria a etapa. */
  const etapaAtual = s.etapa || "";
  const conhecidas = [...ETAPAS, ...ETAPAS_GRUPO];

  const box = $("#modalBox"); box.className="modal narrow";
  box.innerHTML = `
  <header><h3>${sid?"Editar sessão":"Nova sessão"} · ${esc(nome(mid))}</h3><button class="x" onclick="openMentorado('${mid}')">✕</button></header>

      <optgroup label="Sessões 1:1 com mentores">${ETAPAS.map(e=>`<option ${selecionada===e?"selected":""}>${e}</option>`).join("")}</optgroup>
      <optgroup label="Sessões em grupo">${ETAPAS_GRUPO.map(e=>`<option ${selecionada===e?"selected":""}>${esc(e)}</option>`).join("")}</optgroup>
      ${(etapaAtual && !conhecidas.includes(etapaAtual))?`<optgroup label="Registro atual"><option selected>${esc(etapaAtual)}</option></optgroup>`:""}
    </select></div>
    <div class="f"><label>Status</label><select id="s_status">${S_STATUS.map(e=>`<option ${(s.status||"Agendada")===e?"selected":""}>${e}</option>`).join("")}</select></div>
    <div class="f"><label>Mentor</label><select id="s_mentor"><option value="">—</option>${[...MENTORES, ...(s.mentor && !MENTORES.includes(s.mentor) ? [s.mentor] : [])].map(e=>`<option ${s.mentor===e?"selected":""}>${esc(e)}</option>`).join("")}</select></div>
    <div class="f"><label>Data</label>${dateField("s_data", s.data)}</div>
    <div class="f"><label>Hora</label><input id="s_hora" type="time" value="${s.hora?s.hora.slice(0,5):""}"></div>
  </div>
  <div class="fgrid" style="grid-template-columns:1fr">
    <div class="f"><label>Link Meet</label><input id="s_meet" value="${esc(s.link_meet)}"></div>
    <div class="f"><label>Link gravação</label><input id="s_grav" value="${esc(s.link_gravacao)}"></div>
    <div class="f"><label>Link anotações</label><input id="s_anot" value="${esc(s.link_anotacoes)}"></div>
  </div>
  <div class="rowflex">
    <button class="btn" onclick="salvarSessao('${sid||""}','${mid}')">Salvar sessão</button>
    ${(sid && pode("excluir"))?`<button class="btn danger sm" onclick="delSessao('${sid}','${mid}')">Excluir</button>`:""}
  </div>`;
  $("#overlay").classList.add("open");
}
window.salvarSessao = async function(sid, mid){
  const etapa = $("#s_etapa").value;
  const payload = {
    mentorado_id: mid, etapa, ordem: ETAPA_ORD[etapa]||99,
    /* Salvar pelo formulário é o ato de alguém olhar a etapa e responder por
       ela — seja confirmando a que o sync deduziu, seja trocando. A partir daí
       a linha deixa de ser palpite e a etiqueta sai. */
    etapa_deduzida: false,
    status: $("#s_status").value, mentor: $("#s_mentor").value||null,
    data: $("#s_data").value||null, hora: $("#s_hora").value||null,
    link_meet: $("#s_meet").value||null, link_gravacao: $("#s_grav").value||null, link_anotacoes: $("#s_anot").value||null,
  };
  const q = sid ? db.from("sessoes").update(payload).eq("id",sid) : db.from("sessoes").insert(payload);
  const {error} = await q;
  if(error) return toast(error.message,true);
  toast("Sessão salva"); await loadAll(); openMentorado(mid);
}
/* Confirmar exige o mentor: sem isso a sessao entra como concluida sem dono
   e some da contagem por mentor, que foi o que aconteceu com o historico do Calendar. */
window.openConfirmarSessao = function(sid, mid){
  const s = S.find(x=>x.id===sid); if(!s) return;
  const opcoes = [...MENTORES, ...(s.mentor && !MENTORES.includes(s.mentor) ? [s.mentor] : [])];
  const box = $("#modalBox"); box.className="modal narrow";
  box.innerHTML = `
  <header><div><h3>Confirmar sessão</h3><div class="sub" style="color:var(--mut);font-size:12px;margin-top:3px">${esc(s.etapa)} · ${esc(nome(mid))} · ${fmtD(s.data)}</div></div>
  <button class="x" onclick="openMentorado('${mid}')">✕</button></header>
  <div class="f" style="margin-bottom:18px">
    <label>Quem atendeu esta sessão?</label>
    <select id="cf_mentor">
      <option value="">Selecione o mentor…</option>
      ${opcoes.map(m=>`<option ${s.mentor===m?"selected":""}>${esc(m)}</option>`).join("")}
    </select>
  </div>
  <div class="rowflex">
    <button class="btn" onclick="confirmarSessao('${sid}','${mid}')">Confirmar como concluída</button>
    <button class="btn ghost sm" onclick="openMentorado('${mid}')">Cancelar</button>
  </div>`;
  $("#overlay").classList.add("open");
}
window.confirmarSessao = async function(sid, mid){
  const mentor = $("#cf_mentor") ? $("#cf_mentor").value : null;
  if(!mentor) return toast("Selecione quem atendeu a sessão", true);
  const {error} = await db.from("sessoes").update({status:"Concluída", mentor}).eq("id",sid);
  if(error) return toast(error.message,true);
  toast("Sessão confirmada como concluída"); await loadAll(); openMentorado(mid);
}
window.delSessao = async function(sid, mid){
  if(!confirm("Excluir esta sessão?")) return;
  const {error} = await db.from("sessoes").delete().eq("id",sid);
  if(error) return toast(error.message,true);
  toast("Sessão excluída"); await loadAll(); openMentorado(mid);
}

/* ================= EXCLUIR MENTORADO ================= */
/* As cinco filhas de `mentorados` sao ON DELETE CASCADE (sessoes, parcelas,
   mentorado_marcos, mentorado_canais, faturamento_mensal): apagar a ficha leva
   junto o historico inteiro, e nada disso aparece num confirm() do navegador.
   Por isso a confirmacao e um modal proprio, que conta o que vai embora antes
   de perguntar, e pede o nome digitado -- excluir mentorado nao pode ser um
   clique de distancia de "Salvar alteracoes". */
function resumoExclusao(id){
  const ss = S.filter(s=>s.mentorado_id===id);
  const partes = [];
  const item = (n, sing, plur) => { if(n) partes.push(`${n} ${n===1?sing:plur}`); };
  item(ss.length, "sessão", "sessões");
  item(P.filter(p=>p.mentorado_id===id).length, "parcela", "parcelas");
  item(MM.filter(x=>x.mentorado_id===id).length, "marco de rota", "marcos de rota");
  item(FAT.filter(f=>f.mentorado_id===id).length, "registro de faturamento", "registros de faturamento");
  return {partes, concluidas: ss.filter(s=>s.status==="Concluída").length};
}
/* Comparacao do nome digitado: sem caixa, sem acento e sem espaco sobrando. A
   confirmacao existe para provar intencao, nao para cobrar ortografia. */
const chaveNome = v => normBusca(v).replace(/\s+/g," ").trim();
window.openExcluirMentorado = function(id){
  const m = M.find(x=>x.id===id); if(!m) return;
  const {partes, concluidas} = resumoExclusao(id);
  const box = $("#modalBox"); box.className="modal narrow";
  box.innerHTML = `
  <header><h3>Excluir mentorado</h3><button class="x" onclick="openMentorado('${id}')">✕</button></header>
  <div style="line-height:1.7;font-size:13px;margin-bottom:18px">
    <b>${esc(m.nome)}</b> e ${partes.length?`o que está pendurado na ficha — ${esc(partes.join(", "))} — somem`:"a ficha some"} do sistema.
    ${concluidas?`<br><span class="val-neg">${concluidas} ${concluidas===1?"sessão concluída sai":"sessões concluídas saem"} da contagem dos mentores</span>, então o fechamento do mês muda.`:""}
    <br>Não há desfazer, e o histórico não volta.
  </div>
  <div class="f" style="margin-bottom:18px">
    <label>Para confirmar, digite o nome do mentorado</label>
    <input id="del_confirma" autocomplete="off" placeholder="${esc(m.nome)}" oninput="conferirNomeExclusao('${id}')">
  </div>
  <div class="rowflex">
    <button class="btn danger" id="del_botao" disabled onclick="excluirMentorado('${id}')">Excluir definitivamente</button>
    <button class="btn ghost" onclick="openMentorado('${id}')">Cancelar</button>
  </div>`;
  $("#overlay").classList.add("open");
}
window.conferirNomeExclusao = function(id){
  const m = M.find(x=>x.id===id);
  const campo = $("#del_confirma"), botao = $("#del_botao");
  if(!m || !campo || !botao) return;
  botao.disabled = chaveNome(campo.value) !== chaveNome(m.nome);
}
window.excluirMentorado = async function(id){
  const m = M.find(x=>x.id===id); if(!m) return;
  const campo = $("#del_confirma");
  if(!campo || chaveNome(campo.value) !== chaveNome(m.nome))
    return toast("Digite o nome do mentorado para confirmar", true);
  const {data, error} = await db.from("mentorados").delete().eq("id",id).select("id");
  if(error) return toast(error.message, true);
  /* O RLS nao recusa, filtra: sem policy de DELETE a resposta volta sem erro e
     com zero linhas. Dizer "excluído" nesse caso seria mentira -- a ficha
     continuaria lá depois do loadAll. */
  if(!data || !data.length)
    return toast("Nada foi excluído — seu acesso não permite apagar mentorados", true);
  closeModal();
  toast("Mentorado excluído");
  irPara("#/mentorados"); // o endereço da ficha morreu junto com ela
  await loadAll();
}

/* ================= NOVO MENTORADO ================= */
window.openNovoMentorado = function(){
  const box = $("#modalBox"); box.className="modal narrow";
  box.innerHTML = `
  <header><h3>Novo mentorado</h3><button class="x" onclick="closeModal()">✕</button></header>
  <div class="fgrid" style="grid-template-columns:1fr 1fr">
    <div class="f" style="grid-column:1/-1"><label>Nome</label><input id="n_nome" placeholder="Nome completo ou razão social"></div>
    <div class="f" style="grid-column:1/-1"><label>E-mail no Google Agenda</label>
      <input id="n_email" type="email" placeholder="o e-mail que ele usa no convite">
      <div class="hint">Preenchendo aqui, o sync casa a sessão por este e-mail e o título do convite não precisa trazer o nome dele.</div>
    </div>
    <div class="f"><label>Data de fechamento</label>${dateField("n_fech", HOJE)}</div>
    <div class="f"><label>Entrada</label><select id="n_ent"><option>Pago</option><option>Pago parcial</option><option>Ainda não</option><option>Patrocinado</option></select></div>
    <div class="f"><label>Forma entrada</label><input id="n_entf" placeholder="pix, cartão…"></div>
    <div class="f"><label>Contrato</label><select id="n_contr"><option>Ainda não</option><option>Aguardando assinatura</option><option>Assinado</option></select></div>
    <div class="f"><label>Restante</label><select id="n_res"><option>Ainda não</option><option>Pago parcial</option><option>Pago</option><option>Patrocinado</option></select></div>
  </div>
  <button class="btn" onclick="criarMentorado()">Criar mentorado</button>`;
  $("#overlay").classList.add("open");
}
window.criarMentorado = async function(){
  const nomeV = $("#n_nome").value.trim();
  if(!nomeV) return toast("Informe o nome",true);
  const {data,error} = await db.from("mentorados").insert({
    nome:nomeV, email: normalizaEmail($("#n_email").value),
    data_fechamento: $("#n_fech").value||null,
    entrada_status: $("#n_ent").value, entrada_forma_pgto: $("#n_entf").value||null,
    contrato_status: $("#n_contr").value, restante_status: $("#n_res").value, cancelado:false
  }).select().single();
  if(error) return toast(msgErroMentorado(error),true);
  toast("Mentorado criado"); await loadAll(); openMentorado(data.id,'completo');
}

boot();
</script>
