<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central de Controle · Elite 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
  /* ---- design system Elite 3D ---- */
  --background:#101214;
  --background-deep:#090A0A;
  --background-alt:#0E0E0F;
  --surface:#121416;
  --surface-active:rgba(185,255,70,.08);
  --surface-selected:rgba(185,255,70,.16);
  --surface-input:#1A1F26;
  --surface-interactive:#1B2916;
  --primary:#B9FF46;
  --primary-foreground:#10141A;
  --foreground:#FDFDFD;
  --muted-foreground:rgba(232,237,245,.72);
  --subtle-foreground:#929699;
  --disabled-foreground:#5C6166;
  --border:rgba(254,254,254,.08);
  --border-hover:rgba(254,254,254,.16);
  --border-primary:rgba(185,255,70,.30);
  --danger:#E5484D;
  --danger-dim:rgba(229,72,77,.12);
  --danger-line:rgba(229,72,77,.32);
  --warning:#E8A13C;
  --warning-dim:rgba(232,161,60,.12);
  --info:#4D9FE0;
  --info-dim:rgba(77,159,224,.12);
  --radius-card:20px;
  --radius-control:10px;
  --radius-pill:999px;
  --glow-primary:0 0 0 1px rgba(185,255,70,.18), 0 0 24px rgba(185,255,70,.10);
  --speed:170ms;

  /* ---- aliases legados (mantêm o JS existente funcionando) ---- */
  --bg:var(--background);
  --panel:var(--surface);
  --panel2:var(--surface-input);
  --line:var(--border);
  --txt:var(--foreground);
  --mut:var(--muted-foreground);
  --dim:var(--subtle-foreground);
  --green:var(--primary);
  --green-dim:var(--surface-active);
  --green-line:var(--border-primary);
  --amber:var(--warning);
  --amber-dim:var(--warning-dim);
  --red:var(--danger);
  --red-dim:var(--danger-dim);
  --blue:var(--info);
  --blue-dim:var(--info-dim);
  --radius:var(--radius-control);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--background);color:var(--foreground);font-family:'Inter Tight',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
h1,h2,h3,.display{font-family:'Plus Jakarta Sans',system-ui,sans-serif;letter-spacing:-.02em}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px;background:var(--surface-input);border:1px solid var(--border);color:var(--foreground);border-radius:var(--radius-control);padding:11px 12px;outline:none;width:100%;min-height:44px;transition:border-color var(--speed) ease,box-shadow var(--speed) ease}
input::placeholder,textarea::placeholder{color:var(--disabled-foreground)}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(185,255,70,.12)}
input:disabled,select:disabled,textarea:disabled{opacity:.45;cursor:not-allowed}
input[aria-invalid="true"],.f.err input{border-color:var(--danger)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--subtle-foreground) 50%),linear-gradient(135deg,var(--subtle-foreground) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
aside{width:236px;flex-shrink:0;background:var(--background-deep);border-right:1px solid var(--border);padding:26px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{padding:0 8px 26px}
.brand .eyebrow{font-size:10px;letter-spacing:.2em;color:var(--primary);font-weight:600;text-transform:uppercase}
.brand h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:18px;font-weight:800;letter-spacing:-.025em;margin-top:6px}
.nav button{position:relative;display:flex;align-items:center;gap:11px;width:100%;background:none;border:none;color:var(--subtle-foreground);padding:11px 12px;border-radius:var(--radius-control);font-size:13.5px;font-weight:500;text-align:left;margin-bottom:3px;min-height:44px;transition:background var(--speed) ease,color var(--speed) ease}
.nav button:hover{background:rgba(254,254,254,.04);color:var(--foreground)}
.nav button.active{background:var(--surface-active);color:var(--primary);font-weight:600}
.nav button.active::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:20px;border-radius:0 3px 3px 0;background:var(--primary)}
.nav .ic{width:18px;height:18px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center}
.nav .ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.side-foot{margin-top:auto;padding:10px 8px;font-size:11px;color:var(--disabled-foreground);line-height:1.5}
main{flex:1;padding:30px 34px 64px;max-width:1340px;min-width:0}
@media(max-width:600px){main{padding:18px 16px 52px}}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;gap:14px;flex-wrap:wrap}
.topbar h2{font-family:'Plus Jakarta Sans',sans-serif;font-size:24px;font-weight:800;letter-spacing:-.03em}
.topbar .sub{color:var(--muted-foreground);font-size:12.5px;margin-top:4px}

/* ---------- components ---------- */
.btn{background:var(--primary);color:var(--primary-foreground);border:none;border-radius:var(--radius-control);padding:11px 18px;font-weight:700;font-size:13px;min-height:44px;transition:filter var(--speed) ease,transform var(--speed) ease}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.985)}
.btn.ghost{background:transparent;color:var(--foreground);border:1px solid var(--border);font-weight:600}
.btn.ghost:hover{border-color:var(--border-primary);color:var(--primary);filter:none}
.btn.sm{padding:7px 12px;font-size:12px;border-radius:8px;min-height:36px}
.btn.danger{background:var(--danger-dim);color:var(--danger);border:1px solid var(--danger-line)}
/* Botão travado precisa parecer travado: sem isto o "Excluir definitivamente"
   fica com a mesma cara antes e depois do nome conferir. */
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none;transform:none}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:26px}
.cards.quiet{margin-bottom:0}
.cards.quiet .card{padding:16px 18px}
.cards.quiet .card .v{font-size:24px;margin-top:4px}
.cards.quiet .card .k{font-size:10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);padding:20px 22px;transition:border-color var(--speed) ease}
.card:hover{border-color:var(--border-hover)}
.card.sel{border-color:var(--border-primary);box-shadow:var(--glow-primary)}
.card .k{font-size:10.5px;color:var(--subtle-foreground);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.card .v{font-family:'Plus Jakarta Sans',sans-serif;font-size:34px;font-weight:800;margin-top:8px;letter-spacing:-.035em;line-height:1.05}
.card .d{font-size:11.5px;color:var(--subtle-foreground);margin-top:5px}
.card.alert .v{color:var(--warning)}
.card.bad .v{color:var(--danger)}
.card.good .v{color:var(--primary)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);padding:22px;margin-bottom:20px}
.panel h3{font-size:12px;text-transform:uppercase;letter-spacing:.11em;color:var(--subtle-foreground);font-weight:700;margin-bottom:16px}

/* ---------- hierarquia de página ---------- */
.panel.urgent{border-color:var(--border-primary);background:var(--surface)}
.panel.quiet{background:transparent;border-color:transparent;padding:14px 0 0;box-shadow:none}
.panel.quiet h3{color:var(--subtle-foreground);font-size:11.5px}
.attn-list{display:flex;flex-direction:column;gap:1px}
.attn-row{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--border);cursor:pointer;border-radius:8px;transition:background var(--speed) ease}
.attn-row:last-child{border-bottom:none}
.attn-row:hover{background:var(--surface-active)}
.attn-row .tag{flex-shrink:0;width:8px;height:8px;border-radius:var(--radius-pill)}
.attn-row .tag.red{background:var(--danger)}
.attn-row .tag.amber{background:var(--warning)}
.attn-row .who{font-weight:600;font-size:13px;flex:1;min-width:0}
.attn-row .why{color:var(--muted-foreground);font-size:12px}
.attn-row .arrow{color:var(--subtle-foreground);font-size:13px}
.panel.attention{border-color:var(--border-primary);border-left:1px solid var(--border-primary);border-radius:var(--radius-card);box-shadow:var(--glow-primary)}
.panel.attention h3{color:var(--primary)}
.panel.detail{background:transparent;border-color:var(--border)}
.panel.detail h3{color:var(--subtle-foreground);font-weight:600;letter-spacing:.08em}
.section-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.16em;color:var(--subtle-foreground);font-weight:700;margin:32px 0 14px;display:flex;align-items:center;gap:10px}
.section-label:first-child{margin-top:0}
.section-label::after{content:"";flex:1;height:1px;background:var(--border)}
.attn-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.attn-item:last-child{border-bottom:none}
.attn-item .lbl{font-size:13px;font-weight:600;display:flex;align-items:center;gap:9px}
.attn-item .lbl .dot{width:7px;height:7px;border-radius:50%;background:var(--warning);flex-shrink:0}
.attn-item.ok .lbl .dot{background:var(--primary)}
.attn-item .cnt{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:16px;letter-spacing:-.02em}
.attn-item.ok .cnt{color:var(--subtle-foreground);font-weight:500}
.attn-item a{font-size:11.5px;color:var(--muted-foreground);text-decoration:underline}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}

table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10px;text-transform:uppercase;letter-spacing:.11em;color:var(--subtle-foreground);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--foreground)}
th.sortable .arrow{color:var(--primary);font-size:10px;margin-left:4px}
td{padding:12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-active)}
/* Linha apontada por um alerta do dashboard. Barra na lateral em vez de fundo
   colorido: o fundo brigaria com o :hover e com o zebrado da tabela. */
tr.alvo td{background:var(--warning-dim)}
tr.alvo td:first-child{box-shadow:inset 3px 0 0 var(--warning)}
.panel.foco{border-color:rgba(232,161,60,.35);background:var(--warning-dim)}
.panel.foco .foco-topo{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.panel.foco h3{color:var(--warning);margin-bottom:0}
.panel.foco .foco-topo a{font-size:11.5px;color:var(--muted-foreground);text-decoration:underline;cursor:pointer;white-space:nowrap}
.panel.foco .foco-dica{font-size:12.5px;color:var(--subtle-foreground);line-height:1.55;margin-top:10px;max-width:78ch}
td.num,th.num{text-align:right;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:600;letter-spacing:-.01em}

.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:var(--radius-pill);font-size:11px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
.pill.green{background:var(--surface-active);color:var(--primary);border-color:var(--border-primary)}
.pill.amber{background:var(--warning-dim);color:var(--warning);border-color:rgba(232,161,60,.3)}
.pill.red{background:var(--danger-dim);color:var(--danger);border-color:var(--danger-line)}
.pill.blue{background:var(--info-dim);color:var(--info);border-color:rgba(77,159,224,.3)}
.pill.gray{background:rgba(254,254,254,.05);color:var(--muted-foreground);border-color:var(--border)}

.prog{display:flex;gap:4px}
.prog i{width:9px;height:9px;border-radius:2px;background:rgba(254,254,254,.06);border:1px solid var(--border)}
.prog i.done{background:var(--primary);border-color:var(--primary)}
.prog i.sched{background:var(--info);border-color:var(--info)}
.prog i.block{background:var(--danger-dim);border-color:var(--danger-line)}

.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.filters input,.filters select{width:auto;min-width:160px}
.filters input[type=search]{min-width:250px}

/* ---------- date picker ---------- */
.dp{position:relative}
.dp-input{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:44px;background:var(--surface-input);border:1px solid var(--border);color:var(--foreground);border-radius:var(--radius-control);padding:11px 12px;font-family:inherit;font-size:13px;text-align:left;transition:border-color var(--speed) ease,box-shadow var(--speed) ease}
.dp-input:hover:not(:disabled){border-color:var(--border-hover)}
.dp-input[aria-expanded="true"]{border-color:var(--primary);box-shadow:0 0 0 3px rgba(185,255,70,.12)}
.dp-input:disabled{opacity:.45;cursor:not-allowed}
.dp-val{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dp-ph{color:var(--disabled-foreground)}
.dp-ic{width:16px;height:16px;flex-shrink:0;stroke:var(--subtle-foreground);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dp-input[aria-expanded="true"] .dp-ic{stroke:var(--primary)}
.dp-pop{position:fixed;z-index:60;width:280px;background:var(--surface);border:1px solid var(--border-hover);border-radius:var(--radius-control);padding:14px;box-shadow:0 20px 44px rgba(9,10,10,.6)}
.dp-head{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.dp-nav{width:32px;min-height:32px;display:flex;align-items:center;justify-content:center;background:none;border:1px solid transparent;border-radius:8px;color:var(--subtle-foreground);font-size:16px;line-height:1}
.dp-nav:hover{background:rgba(254,254,254,.05);color:var(--foreground)}
.dp-title{flex:1;min-height:32px;background:none;border:1px solid transparent;border-radius:8px;color:var(--foreground);font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:700;letter-spacing:-.01em}
.dp-title:hover:not(:disabled){background:rgba(254,254,254,.05);color:var(--primary)}
.dp-title:disabled{cursor:default}
.dp-week,.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dp-week{margin-bottom:4px}
.dp-week span{padding:4px 0;text-align:center;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--subtle-foreground);font-weight:600}
.dp-day{height:32px;background:none;border:1px solid transparent;border-radius:8px;color:var(--foreground);font-size:12.5px;font-weight:500}
.dp-day:hover{background:rgba(254,254,254,.06)}
.dp-day.fora{color:var(--disabled-foreground)}
.dp-day.hoje{border-color:var(--border-primary);color:var(--primary)}
.dp-day.sel{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground);font-weight:700}
.dp-months{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dp-month{min-height:38px;background:none;border:1px solid var(--border);border-radius:8px;color:var(--foreground);font-size:12px;font-weight:600}
.dp-month:hover{border-color:var(--border-primary);color:var(--primary)}
.dp-month.sel{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
.dp-foot{display:flex;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}
.dp-foot button{flex:1;min-height:34px;background:none;border:1px solid var(--border);border-radius:8px;color:var(--muted-foreground);font-size:11.5px;font-weight:600}
.dp-foot button:hover{border-color:var(--border-primary);color:var(--primary)}
@media(max-width:420px){.dp-pop{width:calc(100vw - 24px)}}

/* ---------- lista de seleção múltipla ---------- */
.chk-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:4px;max-height:238px;overflow-y:auto;padding:10px;background:rgba(254,254,254,.02);border:1px solid var(--border);border-radius:var(--radius-control)}
.chk{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;font-size:12.5px;cursor:pointer}
/* `display` de classe ganha de [hidden] por especificidade: sem isto a busca de
   participantes esconderia o item e ele continuaria na tela. */
[hidden]{display:none!important}
.chk:hover{background:rgba(254,254,254,.05)}
.chk input[type=checkbox]{width:16px;height:16px;min-height:0;padding:0;flex-shrink:0;accent-color:var(--primary);cursor:pointer}
.chk span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(9,10,10,.78);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:40px 16px}
.overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);width:100%;max-width:880px;padding:30px}
.modal.narrow{max-width:520px}
.modal header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px}
.modal header h3{font-family:'Plus Jakarta Sans',sans-serif;font-size:20px;font-weight:800;text-transform:none;letter-spacing:-.03em;color:var(--foreground)}
.modal header .x{background:none;border:none;color:var(--subtle-foreground);font-size:20px;line-height:1;padding:6px 10px;border-radius:8px}
.modal header .x:hover{color:var(--foreground);background:rgba(254,254,254,.05)}
.crumb{margin-bottom:14px}
.crumb button{background:none;border:none;color:var(--subtle-foreground);font-size:12.5px;font-weight:500;padding:6px 10px 6px 0;min-height:36px;border-radius:8px;transition:color var(--speed) ease}
.crumb button:hover{color:var(--primary)}
.abas{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:20px;overflow-x:auto}
.abas button{background:none;border:none;border-bottom:2px solid transparent;color:var(--subtle-foreground);font-size:13.5px;font-weight:500;padding:11px 15px;min-height:44px;white-space:nowrap;transition:color var(--speed) ease,border-color var(--speed) ease}
.abas button:hover{color:var(--foreground)}
.abas button.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.stl-origem{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--mut);margin-bottom:18px}
.tw{overflow-x:auto}
.an-conc{display:flex;height:30px;border-radius:6px;overflow:hidden;background:var(--border)}
.an-conc span{display:block;height:100%;border-right:1px solid var(--bg)}
.an-leg{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:13.5px;color:var(--mut)}
.an-leg b{color:var(--foreground);font-weight:600}
.an-leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.an-pills{display:flex;flex-wrap:wrap;gap:8px}
.an-pills .pill{white-space:normal}
tr.an-zero td{color:var(--subtle-foreground)}
.lk-nome{cursor:pointer;color:var(--foreground);border-bottom:1px solid var(--border)}
.lk-nome:hover{color:var(--primary);border-bottom-color:var(--primary)}
.ficha-corpo{padding:26px}
.ficha-corpo .sec:first-child{border-top:none;margin-top:0;padding-top:0}
.ficha-h4{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--primary);font-weight:700;margin-bottom:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:16px}
.f label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--subtle-foreground);font-weight:600;margin-bottom:6px}
.f .hint{font-size:11px;color:var(--subtle-foreground);line-height:1.45;margin-top:6px}
.sec{border-top:1px solid var(--border);margin-top:22px;padding-top:20px}
.sec>h4{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--primary);font-weight:700;margin-bottom:14px}
.parc-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media(max-width:700px){.parc-grid{grid-template-columns:repeat(3,1fr)}}
.parc{position:relative;background:rgba(254,254,254,.03);border:1px solid var(--border);border-radius:var(--radius-control);padding:10px;text-align:center;cursor:pointer;font-size:11px;color:var(--muted-foreground);transition:border-color var(--speed) ease}
.parc:hover{border-color:var(--border-hover)}
.parc b{display:block;font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:700;color:var(--foreground);margin-bottom:3px}

<script>
/* ================= CONFIG ================= */
const SUPABASE_URL = "https://matgynpiscyoshnjzolo.supabase.co";
const SUPABASE_KEY = "sb_publishable_S7cckKfundDsqo-s_qL2-A_lgPkY9Yl";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* lê um token do design system para uso onde só cabe cor literal (Chart.js) */
const cssToken = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* Chart.js herda o tema escuro dos tokens em vez de usar os defaults claros */
if(window.Chart){
  Chart.defaults.font.family = "'Inter Tight', system-ui, sans-serif";

  Chart.defaults.color = cssToken("--subtle-foreground");
  Chart.defaults.borderColor = "rgba(254,254,254,.08)";
  Chart.defaults.plugins.tooltip.backgroundColor = cssToken("--surface");
  Chart.defaults.plugins.tooltip.borderColor = cssToken("--border-primary");
  Chart.defaults.plugins.tooltip.borderWidth = 1;
  Chart.defaults.plugins.tooltip.titleColor = cssToken("--foreground");
  Chart.defaults.plugins.tooltip.bodyColor = cssToken("--muted-foreground");
  Chart.defaults.plugins.tooltip.padding = 10;
  Chart.defaults.plugins.tooltip.cornerRadius = 8;
  Chart.defaults.plugins.tooltip.displayColors = false;
}
/* eixos no tema escuro, reaproveitado pelos dois gráficos */
const chartScales = (extraY={}) => ({
  x:{ grid:{display:false}, border:{color:"rgba(254,254,254,.08)"},
      ticks:{color:cssToken("--subtle-foreground")} },
  y:{ beginAtZero:true, grid:{color:"rgba(254,254,254,.06)"}, border:{display:false},

/* ---- gamificação: faixa derivada do faturamento acumulado real ---- */
const NIVEIS = [
  {nome:"Diamante", min:100000},
  {nome:"Platina",  min:50000},
  {nome:"Ouro",     min:20000},
  {nome:"Prata",    min:10000},
  {nome:"Bronze",   min:1},
  {nome:"Iniciante",min:0},
];
const faturamentoAcumulado = id => FAT.filter(f=>f.mentorado_id===id).reduce((a,f)=>a+Number(f.valor||0),0);
function nivelDe(total){
  const i = NIVEIS.findIndex(n=>total>=n.min);
  const atual = NIVEIS[i];
  const proximo = i>0 ? NIVEIS[i-1] : null;
  const base = atual.min || 0;
  // trunca e limita a 99%: barra cheia só quando o nível realmente subiu
  const pct = proximo ? Math.min(99, Math.floor((total-base)/(proximo.min-base)*100)) : 100;
  return {atual, proximo, pct, total};
}

/* Mentores que recebem novos agendamentos. Quem sai do projeto vai para
   MENTORES_HIST: some dos formularios, mas continua contando no historico. */
const MENTORES = ["Luan","Sergio","Diovani","Petare","Michelle"];
const MENTORES_HIST = ["Israel","Evaldo"];
const TODOS_MENTORES = [...MENTORES, ...MENTORES_HIST];
const ETAPAS = ["Diagnóstico de Negócio","Plano de Ação","Checkup 1","Checkup 2","Checkup 3","Checkup 4","Checkup 5","Checkup 6","Checkup 7","Checkup 8","Checkup 9","Checkup 10"];
/* Sessões em grupo: encontros coletivos, fora da trilha de 12 sessões 1:1.
   Ordem 90+ para nunca colidir com a numeração das etapas individuais. */
const ETAPAS_GRUPO = ["Plantão de Dúvida Semanal","Sessão de Implementação Mensal"];
const ETAPA_ORD = Object.fromEntries([
  ...ETAPAS.map((e,i)=>[e,i+1]),
  ...ETAPAS_GRUPO.map((e,i)=>[e,90+i]),
]);
const ehGrupo = s => !!s && ETAPAS_GRUPO.includes(s.etapa);
const eh1a1   = s => !ehGrupo(s);
const S_STATUS = ["Não iniciada","Agendada","Aguardando confirmação","Concluída","Bloqueada"];

// em Brasília isso já virava o dia seguinte, adiantando vencimentos e "próximas".
const HOJE = new Date().toLocaleDateString("sv-SE",{timeZone:"America/Sao_Paulo"});

let M = [], P = [], S = [];   // mentorados, parcelas, sessoes
let ROTAS = [], MARCOS = [], MM = []; // rotas, marcos_definicao, mentorado_marcos
let CANAIS_DB = [], MC = []; // canais (por rota), mentorado_canais
let FAT = []; // faturamento_mensal
let ORFAS = []; // sessoes cujo evento sumiu do Google Calendar
let COBRANCAS = []; // lia_cobrancas -- so carregada para quem ve financeiro
/* Foto do STLSeller trazida pelo sync-stlseller: stlseller_mentorados,
   stlseller_pedidos_marketplace e stlseller_produtos_vendidos. So para quem ve
   financeiro. O erro fica guardado porque a aba tem que dizer que nao carregou,
   e nao fingir que o mentorado nao tem registro la. */
let STLSELLER = [], STL_PEDIDOS = [], STL_PRODUTOS = [], STLSELLER_ERRO = null;
let view = "dash";
/* `q` e a busca da tela Mentorados; as outras telas tem a sua propria. O termo
   fica separado por tela de proposito: quem filtrou um nome em Sessoes nao
   espera abrir o Financeiro e encontrar a tela recortada pelo mesmo nome. */
let filtro = {q:"", mentor:"", statusFin:"", tipoSessao:"", qDash:"", qSessoes:"", qFin:"", qRotas:"", qAnalise:""};
/* Mes selecionado na matriz de sessoes por mentor ("YYYY-MM"), ou "" para o
   historico inteiro. `null` significa "ainda no padrao": quem resolve e o
   renderDash, que sabe quais meses tem sessao. */
let mesMatriz = null;
/* Foco: o alerta do dashboard manda a tela de Sessoes mostrar so as linhas que
   ele contou, em vez de despejar a tela inteira e deixar a pessoa procurar.
   `{ids, titulo, dica}`, ou null para a tela normal. */
let foco = null;
/* Os ids que cada alerta aponta, preenchidos pelo renderDash a cada render.
   Passar id por handler inline seria furo de escape -- `esc()` nao protege
   dentro de onclick, porque `&#39;` volta a ser `'` no parse de JS. O handler

const FOCO_ALERTA = {dobradas:[], semData:[], semMentor:[], etapaDeduzida:[]};
let rotaAtual = null; // slug da rota selecionada na tela Rotas

/* Capacidades por papel. Antes bastava um booleano `isAdmin`, porque ele

   papel `diretoria` separa as duas — ve tudo, escreve nada — e um booleano

   Isto e interface, nao seguranca: o limite real e o RLS do Postgres, onde

const CAPACIDADES = {

/* ================= DATA ================= */
/* PostgREST corta em 1000 linhas por request e nao devolve erro quando corta.
   `sessoes` e a tabela que cresce mais rapido -- um encontro em grupo grava uma
   linha por participante -- e a que alimenta o fechamento dos mentores, entao
   precisa vir inteira ou a contagem subnotifica calada. */
async function paginado(construir){
  const PASSO = 1000;
  const todas = [];
  for(let de = 0;; de += PASSO){
    const {data, error} = await construir().range(de, de+PASSO-1);
    if(error) return {data:null, error};
    todas.push(...(data||[]));
    if((data||[]).length < PASSO) return {data:todas, error:null};
  }
}
async function loadAll(){
  const mentorQuery = pode("verFinanceiro")
    ? db.from("mentorados").select("*").order("data_fechamento",{ascending:true})
    : db.from("mentorados_basic").select("*").order("data_fechamento",{ascending:true});
  const parcelaQuery = pode("verFinanceiro")
    ? db.from("parcelas").select("*").order("numero")
    : Promise.resolve({data:[], error:null});
  /* Cobrancas da Lia so para quem ve financeiro. O RLS ja barra o mentor, mas
     pedir o que nao se pode ler gastaria viagem e devolveria lista vazia. */
  const cobrancaQuery = pode("verFinanceiro")
    ? db.from("lia_cobrancas").select("*").order("due_date")
    : Promise.resolve({data:[], error:null});
  const semNada = Promise.resolve({data:[], error:null});
  const verStl = pode("verFinanceiro");
  const [m,p,cob,s,r,md,mm,fat,cn,mc,orf,stl,stlPed,stlProd] = await Promise.all([
    mentorQuery,
    parcelaQuery,
    cobrancaQuery,
    paginado(()=>db.from("sessoes").select("*").order("ordem")),
    db.from("rotas").select("*").order("ordem"),
    db.from("marcos_definicao").select("*").order("ordem"),
    db.from("mentorado_marcos").select("*"),
    db.from("faturamento_mensal").select("*"),
    db.from("canais").select("*").order("ordem"),
    db.from("mentorado_canais").select("*"),
    db.from("sessoes_orfas").select("*"),
    verStl ? db.from("stlseller_mentorados").select("*") : semNada,
    verStl ? db.from("stlseller_pedidos_marketplace").select("*") : semNada,
    verStl ? paginado(()=>db.from("stlseller_produtos_vendidos").select("*").order("faturamento",{ascending:false})) : semNada,
  ]);
  if(m.error||p.error||s.error){ toast((m.error||p.error||s.error).message, true); return; }
  M = m.data; P = p.data; S = s.data;
  ROTAS = r.data||[]; MARCOS = md.data||[]; MM = mm.data||[];
  FAT = fat.data||[]; CANAIS_DB = cn.data||[]; MC = mc.data||[]; ORFAS = orf.data||[];
  COBRANCAS = cob.data||[];
  /* O STLSeller nao trava a aplicacao: e dado de referencia, e a ficha segue
     util sem ele. A falha aparece na propria aba. */
  const erroStl = stl.error || stlPed.error || stlProd.error;
  STLSELLER = stl.data||[]; STL_PEDIDOS = stlPed.data||[]; STL_PRODUTOS = stlProd.data||[];
  STLSELLER_ERRO = erroStl ? erroStl.message : null;
  if(erroStl) console.error("[stlseller] load failed", erroStl);
  if(!rotaAtual && ROTAS.length) rotaAtual = ROTAS[0].slug;
  dadosProntos = true;
  render();
}

const $ = s => document.querySelector(s);

const fmtD = d => d ? d.split("-").reverse().join("/") : "—";
const fmtDshort = d => d ? d.slice(8,10)+"/"+d.slice(5,7) : "—";
/* Formas em que uma data pode ser digitada na busca. A tela mostra 17/09, mas

/* Compra de teste na Lia chega igual a venda real. Descartada, a cobrança sai

/* Por que não casou. Derivado na hora em vez de guardado: o motivo muda quando
   o cadastro muda, e um motivo gravado envelheceria sozinho. */
function motivoOrfa(c){

const COBRANCA_LABEL = {paid:"Paga", pending:"Em aberto", overdue:"Atrasada", canceled:"Cancelada"};

/* Dias entre duas datas "YYYY-MM-DD", contados em dia de calendário: usar
   diferença de milissegundos erraria por uma hora no fim do horário de verão. */
function diasAte(data){
  if(!data) return null;
  const [a1,m1,d1] = HOJE.split("-").map(Number);
  const [a2,m2,d2] = data.split("-").map(Number);
  return Math.round((Date.UTC(a2,m2-1,d2) - Date.UTC(a1,m1-1,d1)) / 86400000);
}
function prazoTexto(data){
  const d = diasAte(data);
  if(d === null) return "";
  if(d < -1)  return `venceu há ${-d} dias`;
  if(d === -1) return "venceu ontem";
  if(d === 0)  return "vence hoje";
  if(d === 1)  return "vence amanhã";
  return `vence em ${d} dias`;
}
/* A próxima em aberto, por vencimento. É a pergunta que se faz olhando a ficha:
   quanto falta para a próxima cobrança. */
function proximaParcela(ps){
  return ps.filter(p=>p.status!=="paga" && p.vencimento)
           .sort((a,b)=>a.vencimento < b.vencimento ? -1 : 1)[0] || null;

/* Situacao do mentorado: ativo | pausado | cancelado.
   Fallback para o booleano antigo caso algum registro venha sem situacao. */
function situacaoDe(m){ return (m&&m.situacao) || (m&&m.cancelado ? "cancelado" : "ativo"); }
function ehAtivo(m){ return situacaoDe(m)==="ativo"; }
function pillSituacao(m){
  const st = situacaoDe(m);
  if(st==="cancelado") return `<span class="pill red">cancelado</span>`;

/* Escapa para interpolação em HTML. Cobre também > e ' : havia atributos em
   aspas simples no código, onde só &quot; não bastava. */
function esc(s){ return (s??"").toString()
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
/* E-mail do mentorado: o sync compara com o e-mail do convidado no evento do
   Google, em minúsculas e sem espaço. Guardar em qualquer outro formato
   passaria no único do banco e mesmo assim não casaria com o convite. */
function normalizaEmail(v){
  const e = (v||"").trim().toLowerCase();
  return e || null;
}
/* O único em lower(email) devolve a mensagem crua do Postgres, que não explica
   nada a quem está cadastrando. */
function msgErroMentorado(error){
  const m = (error && error.message) || "";
  if(m.includes("mentorados_email_unico"))
    return "Esse e-mail já está em outro mentorado. Dois cadastros com o mesmo e-mail fariam o sync descartar o evento em vez de escolher um.";
  return m;
}
function linkOr(v, label){

}

/* ================= SESSÕES EM GRUPO ================= */
/* Um encontro coletivo é gravado como uma linha por participante, porque
   sessoes.mentorado_id é obrigatório no banco. Sem reagrupar, um plantão com 30
   inscritos apareceria como 30 linhas na agenda — a chave é etapa+data+hora. */
function agruparGrupo(sessoes){
  const mapa = new Map();
  sessoes.forEach(s=>{
    const chave = [s.etapa, s.data||"", s.hora||""].join("|");
    let e = mapa.get(chave);
    if(!e){
      e = {chave, etapa:s.etapa, data:s.data, hora:s.hora, mentor:s.mentor||null,
           link_meet:null, link_gravacao:null, link_anotacoes:null, itens:[]};
      mapa.set(chave, e);
    }
    e.itens.push(s);
    if(!e.mentor) e.mentor = s.mentor || null;
    ["link_meet","link_gravacao","link_anotacoes"].forEach(k=>{ if(!e[k]) e[k] = s[k] || null; });
  });
  return [...mapa.values()];
}
const contagemStatus = e => e.itens.reduce((a,s)=>{ const k = s.status||"—"; a[k]=(a[k]||0)+1; return a; }, {});
/* Status do encontro: o mais frequente entre os participantes. */
const statusGrupo = e => Object.entries(contagemStatus(e)).sort((a,b)=>b[1]-a[1])[0][0];
/* Plural dos status no resumo do encontro. "Aguardando confirmação" é
   invariável; os outros só ganham "s". */
const STATUS_PLURAL = {
  "Não iniciada":"não iniciadas", "Agendada":"agendadas",
  "Aguardando confirmação":"aguardando confirmação",
  "Concluída":"concluídas", "Bloqueada":"bloqueadas",
};
const resumoStatusGrupo = e => Object.entries(contagemStatus(e)).sort((a,b)=>b[1]-a[1])
  .map(([k,v])=>`${v} ${v===1?k.toLowerCase():(STATUS_PLURAL[k]||k.toLowerCase())}`).join(" · ");
/* Encontros desenhados na tela atual. O onclick guarda só o índice — nunca
   texto vindo do banco interpolado dentro de um atributo. */
let GRUPO_REG = [];
const regGrupo = e => GRUPO_REG.push(e) - 1;
let grupoAberto = null; // encontro aberto no modal, para as ações em lote

/* ================= CAMPO DE DATA (calendário) ================= */
/* Um único componente para todo campo de data do sistema. O valor real continua
   num input com o MESMO id de antes (agora hidden), então tudo que já lia
   $("#id").value segue recebendo "YYYY-MM-DD" — ou "YYYY-MM" no modo mês.
   O botão mostra a data no formato da aplicação (fmtD) e abre o calendário ao
   clique em qualquer ponto do campo, não só num ícone.
   O popover é filho de <body> e position:fixed de propósito: dentro do modal
   ele seria cortado pelo overflow do overlay. */
const DP_SEMANA = ["D","S","T","Q","Q","S","S"];
const DP_MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const DP_ICON = `<svg class="dp-ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>`;
const dpPlaceholder = mode => mode==="month" ? "mm/aaaa" : "dd/mm/aaaa";

function dpLabel(v, mode){
  if(!v) return "";
  if(mode==="month"){ const [y,m] = v.split("-"); return `${MESES_PT[+m-1]}/${y}`; }
  return fmtD(v);
}
/* opt: {disabled, style, title, placeholder, mode:"day"|"month"} */
function dateField(id, value, opt){
  opt = opt || {};
  const mode = opt.mode==="month" ? "month" : "day";
  const v = (value||"").slice(0, mode==="month" ? 7 : 10);
  const ph = opt.placeholder || dpPlaceholder(mode);
  return `<div class="dp"${opt.style?` style="${esc(opt.style)}"`:""}>`
    + `<input type="hidden" id="${esc(id)}" value="${esc(v)}">`
    + `<button type="button" class="dp-input" data-dp="${esc(id)}" data-dp-mode="${mode}"`
    + ` data-dp-ph="${esc(ph)}" aria-haspopup="dialog" aria-expanded="false"`
    + `${opt.disabled?" disabled":""}${opt.title?` title="${esc(opt.title)}"`:""}>`
    + `<span class="dp-val">${v?esc(dpLabel(v,mode)):`<span class="dp-ph">${esc(ph)}</span>`}</span>`
    + DP_ICON + `</button></div>`;
}
const monthField = (id, value, opt) => dateField(id, value, Object.assign({}, opt||{}, {mode:"month"}));

let dpState = null; // {id, mode, trigger, pop, cursor:"YYYY-MM", vista:"dias"|"meses"}
const dpTrigger = id => document.querySelector('.dp-input[data-dp="'+id+'"]');
const dpValor = id => { const el = document.getElementById(id); return el ? el.value : ""; };

function dpSet(id, v){
  const el = document.getElementById(id); if(!el) return;
  el.value = v || "";
  const trig = dpTrigger(id);
  if(trig){
    const mode = trig.dataset.dpMode;
    trig.querySelector(".dp-val").innerHTML = v
      ? esc(dpLabel(v, mode))
      : `<span class="dp-ph">${esc(trig.dataset.dpPh || dpPlaceholder(mode))}</span>`;
  }
  /* mantém quem escutar "change" no campo funcionando como no input nativo */
  el.dispatchEvent(new Event("change", {bubbles:true}));
}
function dpClose(){
  if(!dpState) return;
  dpState.pop.remove();
  if(dpState.trigger.isConnected) dpState.trigger.setAttribute("aria-expanded","false");
  dpState = null;
}
function dpOpen(trigger){
  const jaAberto = dpState && dpState.trigger === trigger;
  dpClose();
  if(jaAberto) return;
  const mode = trigger.dataset.dpMode==="month" ? "month" : "day";
  const pop = document.createElement("div");
  pop.className = "dp-pop";
  pop.setAttribute("role","dialog");
  pop.setAttribute("aria-label", mode==="month" ? "Selecionar mês" : "Selecionar data");
  document.body.appendChild(pop);
  dpState = {
    id: trigger.dataset.dp, mode, trigger, pop,
    cursor: (dpValor(trigger.dataset.dp) || HOJE).slice(0,7),
    vista: mode==="month" ? "meses" : "dias",
  };
  trigger.setAttribute("aria-expanded","true");
  dpRender();
  dpPos();
  const foco = pop.querySelector(".dp-day.sel, .dp-month.sel")
    || pop.querySelector(".dp-day.hoje")
    || pop.querySelector(".dp-day:not(.fora), .dp-month");
  if(foco) foco.focus({preventScroll:true});
}
function dpPos(){
  if(!dpState) return;
  const r = dpState.trigger.getBoundingClientRect();
  const w = dpState.pop.offsetWidth, h = dpState.pop.offsetHeight;
  let top = r.bottom + 6;
  if(top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
  const left = Math.min(r.left, window.innerWidth - w - 8);
  dpState.pop.style.top = top + "px";
  dpState.pop.style.left = Math.max(8, left) + "px";
}
function dpRender(){
  const {id, mode, cursor, vista, pop} = dpState;
  const sel = dpValor(id);
  const [cy, cm] = cursor.split("-").map(Number);
  let corpo;
  if(vista === "meses"){
    corpo = `<div class="dp-months">${DP_MESES.map((_,i)=>{
      const val = `${cy}-${String(i+1).padStart(2,"0")}`;
      const ativo = mode==="month" ? sel===val : cursor===val;
      return `<button type="button" class="dp-month ${ativo?"sel":""}" data-dp-mes="${val}">${MESES_PT[i]}</button>`;
    }).join("")}</div>`;
  } else {
    const inicio = new Date(Date.UTC(cy, cm-1, 1)).getUTCDay();      // 0 = domingo
    const noMes = new Date(Date.UTC(cy, cm, 0)).getUTCDate();
    const noAnterior = new Date(Date.UTC(cy, cm-1, 0)).getUTCDate();
    const cels = [];
    for(let i=inicio-1; i>=0; i--) cels.push({d: noAnterior - i, desloc: -1});
    for(let d=1; d<=noMes; d++)    cels.push({d, desloc: 0});
    while(cels.length % 7)         cels.push({d: cels.length - inicio - noMes + 1, desloc: 1});
    corpo = `<div class="dp-week">${DP_SEMANA.map(d=>`<span>${d}</span>`).join("")}</div>`
      + `<div class="dp-grid">${cels.map(c=>{
          const mRef = cm + c.desloc;
          const y = mRef < 1 ? cy-1 : mRef > 12 ? cy+1 : cy;
          const m = mRef < 1 ? 12   : mRef > 12 ? 1    : mRef;
          const iso = `${y}-${String(m).padStart(2,"0")}-${String(c.d).padStart(2,"0")}`;
          const cls = [c.desloc?"fora":"", iso===HOJE?"hoje":"", iso===sel?"sel":""].filter(Boolean).join(" ");
          return `<button type="button" class="dp-day ${cls}" data-dp-dia="${iso}" aria-label="${esc(fmtD(iso))}">${c.d}</button>`;
        }).join("")}</div>`;
  }
  pop.innerHTML = `
  <div class="dp-head">
    <button type="button" class="dp-nav" data-dp-passo="-1" aria-label="${vista==="meses"?"Ano anterior":"Mês anterior"}">‹</button>
    <button type="button" class="dp-title" data-dp-vista="1"${mode==="month"?" disabled":""}>${vista==="meses"?cy:`${DP_MESES[cm-1]} ${cy}`}</button>
    <button type="button" class="dp-nav" data-dp-passo="1" aria-label="${vista==="meses"?"Próximo ano":"Próximo mês"}">›</button>
  </div>
  ${corpo}
  <div class="dp-foot">
    <button type="button" data-dp-hoje="1">${mode==="month"?"Mês atual":"Hoje"}</button>
    <button type="button" data-dp-limpar="1">Limpar</button>
  </div>`;
}
/* Delegação em captura: pega o clique antes de qualquer handler inline. */
document.addEventListener("click", e=>{
  const alvo = e.target;
  if(!alvo || !alvo.closest) return;
  const trig = alvo.closest(".dp-input");
  if(trig){
    if(!trig.disabled){ e.preventDefault(); e.stopPropagation(); dpOpen(trig); }
    return;
  }
  if(!alvo.closest(".dp-pop")){ dpClose(); return; }
  if(!dpState) return;
  const b = alvo.closest("button"); if(!b) return;
  const {id, mode} = dpState;
  if(b.dataset.dpDia){ dpSet(id, b.dataset.dpDia); dpClose(); return; }
  if(b.dataset.dpMes){
    if(mode === "month"){ dpSet(id, b.dataset.dpMes); dpClose(); }
    else { dpState.cursor = b.dataset.dpMes; dpState.vista = "dias"; dpRender(); dpPos(); }
    return;
  }
  if(b.dataset.dpPasso){
    const passo = +b.dataset.dpPasso;
    let [y, m] = dpState.cursor.split("-").map(Number);
    if(dpState.vista === "meses") y += passo;
    else { m += passo; if(m < 1){ m = 12; y--; } if(m > 12){ m = 1; y++; } }
    dpState.cursor = `${y}-${String(m).padStart(2,"0")}`;
    dpRender(); dpPos(); return;
  }
  if(b.dataset.dpVista){
    dpState.vista = dpState.vista === "meses" ? "dias" : "meses";
    dpRender(); dpPos(); return;
  }
  if(b.dataset.dpHoje){ dpSet(id, mode==="month" ? HOJE.slice(0,7) : HOJE); dpClose(); return; }
  if(b.dataset.dpLimpar){ dpSet(id, ""); dpClose(); return; }
}, true);
/* Teclado: Esc fecha, setas andam pelo calendário. */
document.addEventListener("keydown", e=>{
  if(!dpState) return;
  if(e.key === "Escape"){
    const t = dpState.trigger; dpClose();
    if(t.isConnected) t.focus();
    e.preventDefault(); e.stopPropagation(); return;
  }
  const passos = {ArrowLeft:-1, ArrowRight:1, ArrowUp:-7, ArrowDown:7};
  if(!(e.key in passos) || dpState.vista !== "dias") return;
  const atual = e.target.closest && e.target.closest("[data-dp-dia]");
  if(!atual) return;
  e.preventDefault();
  const d = new Date(atual.dataset.dpDia + "T12:00:00Z");
  d.setUTCDate(d.getUTCDate() + passos[e.key]);
  const iso = d.toISOString().slice(0,10);
  dpState.cursor = iso.slice(0,7);
  dpRender(); dpPos();
  const prox = dpState.pop.querySelector('[data-dp-dia="'+iso+'"]');
  if(prox) prox.focus({preventScroll:true});
}, true);
window.addEventListener("resize", dpClose);
window.addEventListener("scroll", dpPos, true);

/* ================= ORDENAÇÃO GENÉRICA ================= */
let sortState = {};
function toggleSort(tableKey, field){
  const cur = sortState[tableKey];
  if(cur && cur.field===field){ cur.dir = cur.dir==="asc"?"desc":"asc"; }
  else { sortState[tableKey] = {field, dir:"asc"}; }
  render();
}
function sortArrow(tableKey, field){
  const s = sortState[tableKey];
  if(!s || s.field!==field) return "";
  return `<span class="arrow">${s.dir==="asc"?"▲":"▼"}</span>`;
}
function th(tableKey, field, label, extraClass){
  return `<th class="sortable ${extraClass||""}" onclick="toggleSort('${tableKey}','${field}')">${label}${sortArrow(tableKey,field)}</th>`;
}
function applySort(arr, tableKey, getters, defaultField, defaultDir){
  const s = sortState[tableKey] || {field:defaultField, dir:defaultDir||"asc"};
  const getter = getters[s.field];
  if(!getter) return arr;
  const sorted = [...arr].sort((a,b)=>{
    const va = getter(a), vb = getter(b);
    if(va==null && vb==null) return 0;
    if(va==null) return 1;
    if(vb==null) return -1;
    if(va<vb) return -1;
    if(va>vb) return 1;
    return 0;
  });
  if(s.dir==="desc") sorted.reverse();
  return sorted;
}

/* ================= BUSCA POR MENTORADO ================= */
/* Toda tela que lista mentorado em tabela tem a mesma caixa de busca, com o
   mesmo comportamento: sem acento, sem caixa e por partes -- "ana silva" acha
   "Ana Paula da Silva", e "jose" acha "José". */
function normBusca(v){
  return (v==null?"":String(v)).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}
function casaBusca(termo, ...campos){
  const t = normBusca(termo).trim();
  if(!t) return true;
  const alvo = campos.map(normBusca).join(" ");
  return t.split(/\s+/).every(p=>alvo.includes(p));
}
/* O id e fixo por campo porque o innerHTML recria o input a cada tecla: e por
   ele que `setBusca` reencontra a caixa e devolve o foco e o cursor. Sem isso a
   pessoa digita uma letra e perde o teclado. */
function buscaField(campo, placeholder){
  return `<input type="search" id="busca_${campo}" placeholder="${esc(placeholder)}" aria-label="${esc(placeholder)}" value="${esc(filtro[campo]||"")}" oninput="setBusca('${campo}',this)">`;
}
window.setBusca = function(campo, el){
  filtro[campo] = el.value;
  const pos = el.selectionStart;
  render();
  const novo = document.getElementById("busca_"+campo);
  if(!novo) return;
  novo.focus({preventScroll:true});
  try{ novo.setSelectionRange(pos, pos); }catch(e){}
};

/* ================= ENDEREÇO (roteador) ================= */
/* A tela vive na URL. Antes o estado era só a variável `view`: recarregar caía
   no Dashboard, o voltar do navegador saía do sistema e não havia link para
   mandar a alguém. Agora cada tela — e cada ficha — tem endereço.

   Hash e não caminho porque o deploy é estático na Vercel, sem build nem
   servidor: `/mentorado/<id>` pedido direto devolveria 404 antes de o JS rodar. */
const TELAS = ["dash","mentorados","sessoes","rotas","analise","financeiro"];
const ROTULO_TELA = {"#/dash":"Dashboard", "#/mentorados":"Mentorados",
  "#/sessoes":"Sessões", "#/rotas":"Rotas", "#/analise":"STLSeller", "#/financeiro":"Financeiro"};
let fichaId = null, fichaAba = "cadastro";
/* Antes do primeiro loadAll não há o que desenhar, e o roteador pode pedir um
   render antes disso — trocar o hash no boot dispara hashchange na hora. */
let dadosProntos = false;
/* De qual lista a ficha foi aberta — é para lá que o "voltar" da ficha aponta.
   Chegando por link colado não houve lista nenhuma, e Mentorados é o palpite
   honesto. */
let voltarPara = "#/mentorados";

function lerEndereco(){
  const partes = (location.hash||"").replace(/^#\/?/,"").split("/").filter(Boolean).map(decodeURIComponent);
  const [a,b,c] = partes;
  if(a==="mentorado" && b) return {view:"mentorado", id:b, aba: ABAS_FICHA.includes(c)?c:"cadastro"};
  if(TELAS.includes(a)) return {view:a};
  return {view:"dash"};
}
/* `desenhar` é falso no boot: o roteador acerta o estado antes dos dados
   chegarem, e quem desenha é o render() no fim do loadAll. */
function aplicarEndereco(desenhar=true){
  if(!myRole) return; // hashchange antes do login não tem tela para desenhar
  const e = lerEndereco();
  // o financeiro é fechado por papel: link colado não abre o que a tela esconde
  if((e.view==="financeiro" || e.view==="analise") && !pode("verFinanceiro")) return irPara("#/dash");
  if(e.view!=="sessoes") foco = null; // foco é do alerta que trouxe a pessoa aqui
  if(e.view!=="mentorado") voltarPara = "#/"+e.view;
  view = e.view; fichaId = e.id||null; fichaAba = e.aba||"cadastro";
  /* Na ficha o item aceso é a lista de onde ela veio: a ficha não é uma sexta
     tela do menu, é o detalhe de uma das cinco. */
  const aceso = e.view==="mentorado" ? voltarPara.replace("#/","") : e.view;
  document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active", b.dataset.view===aceso));
  if(desenhar){ closeModal(); render(); }
}
/* Trocar o hash dispara `hashchange`, e é de lá que sai o desenho. Pedir o
   endereço em que já se está não dispara nada — daí a chamada direta: é o caso
   de quem fecha um submodal e volta para a ficha que está atrás dele. */
function irPara(hash){
  if(location.hash === hash) aplicarEndereco();
  else location.hash = hash;
}
window.irPara = irPara;
window.addEventListener("hashchange", ()=>aplicarEndereco());

function setView(v){ irPara("#/"+v); }
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>setView(b.dataset.view));
function render(){
  if(!dadosProntos) return; // quem chega antes dos dados espera o loadAll
  dpClose(); // calendário aberto não sobrevive a um re-render da tela
  if(view==="mentorado") renderFicha();
  else if(view==="dash") renderDash();
  else if(view==="mentorados") renderMentorados();
  else if(view==="sessoes") renderSessoes();
  else if(view==="rotas") renderRotas();
  else if(view==="financeiro" && pode("verFinanceiro")) renderFinanceiro();
  else if(view==="analise" && pode("verFinanceiro")) renderAnalise();
  else { view="dash"; renderDash(); }
}

/* Agrupa as sessoes 1:1 concluidas em REUNIOES. Vive fora do renderDash porque
   a tela de Sessoes marca as mesmas linhas: duas implementacoes da mesma regra
   divergiriam, e e ela que decide o fechamento dos mentores.

   Uma reuniao pode estar gravada duas vezes -- o sync procura a linha manual
   por `etapa` e insere outra quando o titulo do evento nomeia etapa diferente
   da que esta na trilha. Mesmo mentorado, data, hora e mentor e a mesma reuniao. */
function reunioesConcluidas1a1(){
  const porSlot = new Map();
  S.filter(s=>eh1a1(s)&&s.status==="Concluída").forEach(s=>{
    // Sem data nao da para afirmar que e a mesma reuniao: cada uma fica sozinha.
    const k = s.data ? `${s.mentorado_id}|${s.data}|${s.hora||""}|${s.mentor||""}` : `sem-data|${s.id}`;
    if(!porSlot.has(k)) porSlot.set(k, []);
    porSlot.get(k).push(s);
  });
  /* Fica a linha registrada na mao (`google_event_id` nulo): a etapa dela foi
     escolhida por uma pessoa olhando a trilha, nao herdada do titulo que alguem
     digitou no Calendar. Empate desfeito pelo id, para a escolha nao variar. */
  const escolher = ls => ls.length===1 ? ls[0]
    : ls.slice().sort((a,b)=>((a.google_event_id?1:0)-(b.google_event_id?1:0)) || (a.id<b.id?-1:1))[0];
  const slots = [...porSlot.values()];
  const reunioes = slots.map(escolher);
  return {
    reunioes,
    dobradas: slots.filter(ls=>ls.length>1).map(itens=>({itens, escolhida:escolher(itens)})),
    contadas: new Set(reunioes.map(s=>s.id)),
  };
}

/* Seletor de mes da matriz de mentores. Handler em window, como os outros: e o
   que o onchange inline alcanca, e e por onde a suite mexe no recorte. */
window.setMesMatriz = function(v){ mesMatriz = v; renderDash(); };
function renderDash(){
  GRUPO_REG.length = 0;
  const ativos = M.filter(ehAtivo);
  /* Sessões 1:1 e em grupo contadas separadamente: somar as duas inflaria o
     total e distorceria a trilha de 12 sessões. */
  const S1 = S.filter(eh1a1), SG = S.filter(ehGrupo);
  const temGrupo = SG.length > 0;
  const concl = S1.filter(s=>s.status==="Concluída").length;
  const agend = S1.filter(s=>s.status==="Agendada");
  const grupoConcl = agruparGrupo(SG.filter(s=>s.status==="Concluída"));
  const grupoAgend = agruparGrupo(SG.filter(s=>s.status==="Agendada"));
  const presencasGrupo = SG.filter(s=>s.status==="Concluída").length;
  const aguardConf = S.filter(s=>s.status==="Aguardando confirmação").length;
  const contratosPend = ativos.filter(m=>m.contrato_status!=="Assinado").length;
  /* Fichas que a Lia criou a partir de um pagamento e que ninguém completou.
     Nascem só com nome e e-mail: sem contrato, ciclo, mentor nem datas. Sem
     este alerta elas se perderiam no meio das outras. */
  const incompletos = M.filter(m=>m.cadastro_incompleto && situacaoDe(m)!=="cancelado");
  const vencidas = P.filter(p=>parcelaVencida(p) && ehAtivo(M.find(m=>m.id===p.mentorado_id)));
  /* Quem tem sessão agendada não está parado — sai da lista.
     Para os demais a régua é a última sessão concluída; quem NUNCA concluiu
     nenhuma é medido pela data de fechamento. Antes esse grupo era descartado
     por um "if(!ss.length) return false", o que escondia justamente o caso
     mais grave: contrato fechado há meses e a mentoria nunca começou. */
  const ultimaConcluida = mid => sessoes1a1De(mid)
    .filter(s=>s.status==="Concluída"&&s.data).map(s=>s.data).sort().pop() || null;
  const semSessao30 = ativos.filter(m=>{
    if(sessoes1a1De(m.id).some(s=>s.status==="Agendada")) return false;
    const ref = ultimaConcluida(m.id) || m.data_fechamento;
    if(!ref) return false;
    return (new Date(HOJE)-new Date(ref))/864e5 > 30;
  });

  /* ===== matriz mentor x etapa: a base do fechamento dos mentores =====

     Conta REUNIAO, nao linha. Uma mesma reuniao pode estar gravada duas vezes:
     o sync do Calendar procura a linha ja existente por `etapa`, entao quando o
     titulo do evento nomeia uma etapa diferente da que estava na trilha, ele nao
     acha a linha manual e insere outra. Sobram duas sessoes concluidas com o
     mesmo mentorado, data, hora e mentor -- uma reuniao paga em dobro.

     Ao colapsar o slot, fica a linha registrada na mao (`google_event_id` nulo):
     a etapa dela foi escolhida por uma pessoa olhando a trilha, nao herdada do
     titulo que alguem digitou no Google Agenda. */
  const {reunioes: reunioes1a1, dobradas} = reunioesConcluidas1a1();

  /* `sessoes.mentor` e texto livre no banco, sem FK para `profiles`. Duas
     grafias do mesmo nome viravam duas linhas na tabela e partiam a contagem em
     duas. Hoje os dados estao limpos -- isto e o que impede uma grafia nova,
     vinda do sync ou de edicao direta no banco, de reabrir o problema calada. */
  const chaveMentor = mt => (mt||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim().toLowerCase();
  const CANON_MENTOR = Object.fromEntries(TODOS_MENTORES.map(m=>[chaveMentor(m), m]));
  const nomeMentor = s => CANON_MENTOR[chaveMentor(s.mentor)] || (s.mentor||"").replace(/\s+/g," ").trim();
  const temMentor = s => !!chaveMentor(s.mentor);

  /* Recorte por mes. Os meses saem das proprias reunioes concluidas, mais o mes
     corrente -- senao o mes que acabou de comecar nao teria opcao no seletor. */
  const mesDe = s => (s.data||"").slice(0,7);
  const SGconcl = SG.filter(s=>s.status==="Concluída");
  const mesesComReuniao = [...new Set([...reunioes1a1.filter(s=>s.data).map(mesDe),
    ...SGconcl.filter(s=>s.data).map(mesDe)])].sort().reverse();
  const mesesMatriz = [...new Set([HOJE.slice(0,7), ...mesesComReuniao])].sort().reverse();
  /* Padrao: o mes corrente, que e o do fechamento. Se ele ainda nao tem sessao
     concluida nenhuma -- comeco de mes, ou nada confirmado ainda -- cai no mes
     mais recente que tem, senao a tabela abriria vazia parecendo defeito. Qual
     mes ficou escolhido esta escrito no seletor, entao nao da para confundir. */
  if(mesMatriz === null) mesMatriz = mesesComReuniao.includes(HOJE.slice(0,7))
    ? HOJE.slice(0,7) : (mesesComReuniao[0] || "");
  if(mesMatriz && !mesesMatriz.includes(mesMatriz)) mesMatriz = "";
  const noMes = s => !mesMatriz || mesDe(s)===mesMatriz;

  const reunioesMes = reunioes1a1.filter(noMes);
  const grupoMes = agruparGrupo(SGconcl.filter(noMes));
  const temGrupoMes = grupoMes.length > 0;
  const dobradasMes = dobradas.filter(d=>noMes(d.escolhida));
  // Concluida sem data nao entra em mes nenhum: some do recorte em vez de errar.
  const semDataFora = mesMatriz ? reunioes1a1.filter(s=>!s.data).length : 0;

  const etapasAtivas = [...new Set(S1.map(s=>s.etapa))].sort((a,b)=>ETAPA_ORD[a]-ETAPA_ORD[b]);
  // Deriva a lista de quem aparece na matriz dos proprios dados: assim ninguem
  // some da contagem ao sair do projeto, nem depende de estar na constante.
  const mentoresComSessao = [...new Set([
    ...reunioesMes.filter(temMentor).map(nomeMentor), ...grupoMes.filter(temMentor).map(nomeMentor)])];
  const matriz = mentoresComSessao.map(mt=>{
    const minhas = reunioesMes.filter(s=>nomeMentor(s)===mt);
    const row = etapasAtivas.map(et=>minhas.filter(s=>s.etapa===et).length);
    /* 1:1 e grupo ficam em colunas separadas de proposito. Somar os dois num
       total unico misturava unidades: uma sessao individual e um encontro
       coletivo com 30 inscritos entravam com peso 1 cada. */
    const encontros = grupoMes.filter(e=>nomeMentor(e)===mt);
    return {mt, row, tot1a1:minhas.length, grupo:encontros.length,
            presencas:encontros.reduce((a,e)=>a+e.itens.length,0), inativo:!MENTORES.includes(mt)};
  }).filter(r=>r.tot1a1||r.grupo).sort((a,b)=>(b.tot1a1-a.tot1a1)||(b.grupo-a.grupo));
  // Sessoes concluidas sem mentor identificado: ficam visiveis em vez de sumir.
  const semMentorReunioes = reunioesMes.filter(s=>!temMentor(s));
  const semMentorRow = etapasAtivas.map(et=>semMentorReunioes.filter(s=>s.etapa===et).length);
  const semMentorGrupo = grupoMes.filter(e=>!temMentor(e)).length;
  const semMentorTot = semMentorReunioes.length + semMentorGrupo;
  const aguardSemMentor = S.filter(s=>!s.mentor&&s.status==="Aguardando confirmação").length;
  /* Publica o que cada alerta aponta, para o link levar direto nas linhas.
     Nas dobradas vao as DUAS linhas do par: para decidir qual etapa esta errada
     e preciso ver as duas lado a lado, nao so a que ficou de fora da conta. */
  FOCO_ALERTA.dobradas  = dobradasMes.flatMap(d=>d.itens.map(s=>s.id));
  FOCO_ALERTA.semData   = reunioes1a1.filter(s=>!s.data).map(s=>s.id);
  FOCO_ALERTA.semMentor = S.filter(s=>!s.mentor&&s.status==="Aguardando confirmação").map(s=>s.id);
  /* Etapa deduzida vale enquanto ninguém tiver salvado a sessão — inclusive nas
     já concluídas, porque é ali que a etapa errada entra na matriz do mentor. */
  const etapaDeduzida = S.filter(s=>s.etapa_deduzida);
  FOCO_ALERTA.etapaDeduzida = etapaDeduzida.map(s=>s.id);

  // Cinto de segurança: "próximas" nunca mostra data passada, mesmo que algo
  // fique preso em "Agendada" no banco. Ordena por data + hora.
  /* `alvo` e o texto que a busca desta tela varre. No encontro em grupo a
     coluna mostra "N participante(s)", entao sem os nomes dos participantes no
     alvo procurar por uma pessoa esconderia justamente o encontro dela. */
  const proximas = [
    ...S1.filter(s=>s.status==="Agendada" && s.data && s.data>=HOJE).map(s=>({
      grupo:false, data:s.data, hora:s.hora, etapa:s.etapa, mentor:s.mentor,
      quem:nome(s.mentorado_id), mid:s.mentorado_id,
      alvo:`${nome(s.mentorado_id)} ${s.etapa||""} ${s.mentor||""}`,
    })),
    ...agruparGrupo(SG.filter(s=>s.status==="Agendada" && s.data && s.data>=HOJE)).map(e=>({
      grupo:true, data:e.data, hora:e.hora, etapa:e.etapa, mentor:e.mentor,
      quem:`${e.itens.length} participante(s)`, entrada:e,

  const verFin = pode("verFinanceiro");

  // Progressão por faturamento: só entra quem tem faturamento real registrado.

  const comFaturamento = ativos
    .map(m=>({m, nv: nivelDe(faturamentoAcumulado(m.id))}))

    .sort((a,b)=>b.nv.total-a.nv.total);

  /* As listas de mentorado desta tela respondem a busca; os contadores de cima
     nao. Um alerta que mudasse de numero conforme o texto digitado deixaria de
     ser o total da operacao, que e o que ele existe para dizer. */

  // Itens de atenção: financeiros só para admin; risco de estagnação vale para todos

    verFin ? {label:"Contratos pendentes de assinatura", count:contratosPend, view:null} : null,

    aguardConf ? {label:"Sessões aguardando confirmação", count:aguardConf, view:"sessoes"} : null,
    ORFAS.length ? {label:"Sessões sem evento no Google Agenda", count:ORFAS.length, anchor:"orfas"} : null,
    /* Só para quem vê financeiro: é dinheiro recebido que a aplicação ainda não
       sabe de quem é. É o único alerta em que a falha é silenciosa — sem ele,

    verFin && cobrancasOrfas().length
      ? {label:"Cobranças da Lia sem mentorado identificado", count:cobrancasOrfas().length, view:"financeiro"}

  const temAtencao = attnItems.some(i=>i.count>0);

  $("#app").innerHTML = `

  ${comFaturamento.length?`

  <div class="niveis-legend">${NIVEIS.slice().reverse().map(n=>`<span class="niv-chip"><i class="niv-dot"></i>${n.nome}${n.min>0?` · ${n.min>=1000?(n.min/1000)+"k":n.min}`:""}</span>`).join("")}</div>

      <tbody>${matriz.map(r=>`<tr><td class="mentor-chip">${esc(r.mt)}${r.inativo?'<span class="pill gray" style="margin-left:8px">fora do projeto</span>':''}</td>${r.row.map(v=>`<td class="num">${v||"·"}</td>`).join("")}<td class="num" style="color:var(--green);font-weight:700">${r.tot1a1||"·"}</td>${temGrupoMes?`<td class="num" title="${r.presencas} presença(s) somada(s)">${r.grupo||"·"}</td>`:""}</tr>`).join("")}

      ${proximas.map(p=>`<tr class="click" onclick="${p.grupo?`openGrupo(${regGrupo(p.entrada)})`:`openMentorado('${p.mid}','sessoes')`}"><td>${cellDataHora(p.data, p.hora)}</td><td>${p.grupo?`<span class="pill blue">grupo</span> `:""}${esc(p.quem)}</td><td>${esc(p.etapa)}</td><td>${esc(p.mentor||"—")}</td></tr>`).join("")}</tbody></table>` : `<div class="empty">${filtro.qDash?"Nenhuma sessão agendada para essa busca.":"Nenhuma sessão agendada. Agende pela ficha do mentorado."}</div>`}

  <div class="sub" style="color:var(--mut);font-size:12px;margin:-8px 0 14px">O evento foi apagado, renomeado ou saiu da janela de sincronização. Estes registros pararam de receber atualização e precisam de conferência manual.</div>
  ${orfasVis.length?`<div style="overflow-x:auto"><table><thead><tr><th>Data</th><th>Mentorado</th><th>Etapa</th><th>Mentor</th><th>Status</th></tr></thead><tbody>
  ${orfasVis.slice().sort((a,b)=>(a.data||"")<(b.data||"")?-1:1).map(o=>`<tr class="click" onclick="openMentorado('${o.mentorado_id}','sessoes')">
    <td>${cellDataHora(o.data, o.hora)}</td><td>${esc(o.mentorado_nome)}</td><td>${esc(o.etapa)}</td>
    <td>${o.mentor?esc(o.mentor):'<span class="pill amber">sem mentor</span>'}</td><td>${pillSess(o.status)}</td>
  </tr>`).join("")}</tbody></table></div>`:`<div class="empty">Nenhuma das ${ORFAS.length} sessões sem evento casa com a busca.</div>`}</div>`:""}
  ${semSessao30.length?`<div class="panel detail" id="risco"><h3>Mentorados sem sessão há +30 dias</h3>
  ${semSessao30Vis.length?`<div style="overflow-x:auto"><table><thead><tr><th>Mentorado</th><th>Última sessão</th><th></th></tr></thead><tbody>
  ${semSessao30Vis.map(m=>{
    const last = ultimaConcluida(m.id);
    return `<tr class="click" onclick="openMentorado('${m.id}','sessoes')"><td>${esc(m.nome)}</td>`

/* ================= MENTORADOS ================= */
function renderMentorados(){
  let list = M.slice();
  if(filtro.q) list = list.filter(m=>casaBusca(filtro.q, m.nome));
  if(filtro.statusFin==="contrato") list = list.filter(m=>ehAtivo(m) && m.contrato_status!=="Assinado");
  if(filtro.statusFin==="ativos") list = list.filter(ehAtivo);
  if(filtro.statusFin==="pausados") list = list.filter(m=>situacaoDe(m)==="pausado");
  if(filtro.statusFin==="incompletos") list = list.filter(m=>m.cadastro_incompleto);

  const verFin = pode("verFinanceiro");
  list = applySort(list, "mentorados", {
    nome: m=>m.nome.toLowerCase(),
    fechamento: m=>m.data_fechamento||"",
    contrato: m=>m.contrato_status||"",
    sessoes: m=>sessoes1a1De(m.id).filter(s=>s.status==="Concluída").length,
  }, "nome", "asc");

  $("#app").innerHTML = `
  <div class="topbar"><div><h2>Mentorados</h2><div class="sub">${list.length} de ${M.length} registro(s) · dados financeiros ficam em Financeiro</div></div>
  ${btnNovoMentorado()}</div>
  <div class="panel" style="padding:14px 16px">
  <div class="filters" style="margin-bottom:0">
    ${buscaField("q","Buscar mentorado por nome…")}
    <select onchange="filtro.statusFin=this.value;renderMentorados()">
      <option value="">Todos</option>
      <option value="ativos" ${filtro.statusFin==="ativos"?"selected":""}>Somente ativos</option>
      <option value="pausados" ${filtro.statusFin==="pausados"?"selected":""}>Somente pausados</option>
      <option value="incompletos" ${filtro.statusFin==="incompletos"?"selected":""}>Cadastro incompleto</option>
      ${verFin?`<option value="contrato" ${filtro.statusFin==="contrato"?"selected":""}>Contrato pendente</option>`:''}
    </select>
  </div>
  </div>
  <div class="panel" style="padding:6px 10px;overflow-x:auto">
  <table><thead><tr>${th("mentorados","nome","Mentorado")}${th("mentorados","fechamento","Fechamento")}${verFin?th("mentorados","contrato","Contrato"):''}${th("mentorados","sessoes","Sessões")}</tr></thead><tbody>
  ${list.map(m=>{
    return `<tr class="click" onclick="openMentorado('${m.id}','completo')" ${!ehAtivo(m)?'style="opacity:.55"':""}>
      <td style="font-weight:600">${esc(m.nome)} ${pillSituacao(m)}${m.cadastro_incompleto?` <span class="pill amber" title="Ficha criada por um pagamento na Lia. Falta contrato, ciclo, mentor e datas — abra e salve para completar.">cadastro incompleto</span>`:""}</td>
      <td class="mono">${fmtD(m.data_fechamento)}</td>
      ${verFin?`<td>${pillContrato(m.contrato_status)}</td>`:''}
      <td>${progBar(m.id)}</td>
    </tr>`;
  }).join("")}</tbody></table>
  ${!list.length?'<div class="empty">Nenhum mentorado encontrado com esses filtros.</div>':""}
  </div>`;
}

/* ================= SESSÕES (agenda) ================= */
/* A tela é dividida em dois blocos: sessões 1:1 com mentores (a trilha de 12
   etapas) e sessões em grupo (plantão semanal e implementação mensal). A
   divisão vale também para os contadores do topo, o filtro de tipo e os
   agrupamentos por categoria. */
function renderSessoes(){
  GRUPO_REG.length = 0;
  let list = S.slice();
  /* Foco: so as linhas que o alerta do dashboard contou. Vem antes dos filtros
     de tipo e mentor de proposito -- o alerta aponta linhas especificas, e um
     filtro nao deveria conseguir escondê-las. */
  const focoIds = foco ? new Set(foco.ids) : null;
  if(focoIds) list = list.filter(s=>focoIds.has(s.id));
  if(filtro.mentor==="__sem__") list = list.filter(s=>!s.mentor);
  else if(filtro.mentor) list = list.filter(s=>s.mentor===filtro.mentor);
  /* A busca corta as linhas 1:1 aqui, mas os encontros em grupo so depois de
     agrupados: filtrar linha a linha deixaria o encontro com um participante so
     e a coluna "Participantes" mentiria sobre quem esteve na sala. */
  const ind = list.filter(eh1a1).filter(s=>casaBusca(filtro.qSessoes, nome(s.mentorado_id), s.etapa, s.mentor, alvoBuscaData(s.data, s.hora)));
  const grp = list.filter(ehGrupo);
  const casaEncontro = e => casaBusca(filtro.qSessoes, e.itens.map(i=>nome(i.mentorado_id)).join(" "), e.mentor, e.etapa, alvoBuscaData(e.data, e.hora));
  /* Sob foco, secao que ficaria vazia nao aparece: um painel "0" nao informa
     nada e faz a tela parecer quebrada. */
  const mostraInd = filtro.tipoSessao !== "grupo" && (!foco || ind.length > 0);
  const mostraGrp = filtro.tipoSessao !== "individual" && (!foco || grp.length > 0);
  const podeCriar = pode("criarSessao");

  /* Marcadores: mesma regra do fechamento, por isso vem do mesmo helper que o
     dashboard usa. Aparecem sempre, com ou sem foco -- sao poucas linhas e
     quem estiver navegando a tela ganha o aviso de graca. */
  const {dobradas, contadas} = reunioesConcluidas1a1();
  const emDobro = new Set(dobradas.flatMap(d=>d.itens.map(s=>s.id)));
  const marcaLinha = s => {
    if(emDobro.has(s.id)) return contadas.has(s.id)
      ? ' <span class="pill green" title="Das linhas desta mesma reunião, é esta que entra na contagem do mentor">contada</span>'
      : ' <span class="pill amber" title="Mesma reunião (mesmo mentorado, data, hora e mentor) de outra linha já contada — esta ficou fora para não contar em dobro">ignorada · mesma reunião</span>';
    if(s.status==="Concluída" && !s.data) return ' <span class="pill amber" title="Concluída sem data não entra em nenhum mês do fechamento">sem data</span>';
    if(s.status==="Aguardando confirmação" && !s.mentor) return ' <span class="pill amber" title="Sem mentor na linha, a sessão não será creditada a ninguém">sem mentor</span>';
    /* O título do evento não dizia a etapa e o sync escolheu pela trilha. Fica
       marcado até alguém salvar a sessão — a etapa alimenta a matriz que fecha
       o mês dos mentores, e palpite não confirmado não pode passar por certeza. */
    if(s.etapa_deduzida) return ' <span class="pill blue" title="O título do evento não dizia a etapa; o sync deduziu pela trilha. Abra a sessão e salve para confirmar ou corrigir.">etapa deduzida</span>';
    return "";
  };

  const getters = {
    data: s=>s.data||"",
    mentorado: s=>nome(s.mentorado_id).toLowerCase(),
    etapa: s=>ETAPA_ORD[s.etapa]||99,
    mentor: s=>s.mentor||"",
  };
  const gettersGrupo = {
    data: e=>e.data||"",
    mentor: e=>e.mentor||"",
    participantes: e=>e.itens.length,
  };
  const blocos = [
    /* "Aguardando confirmacao" nao tinha bloco nenhum: as 27 sessoes nesse
       estado (08/09/2026) so eram alcancaveis abrindo a ficha de cada mentorado,
       uma por uma, e o alerta do dashboard mandava para uma tela onde elas nao
       apareciam. Vem primeiro porque e o unico bloco que pede acao: cada uma
       confirmada entra no fechamento do mes. */
    {key:"aguardando", titulo:"Aguardando confirmação",  itens: ind.filter(s=>s.status==="Aguardando confirmação")},
    {key:"agendadas",  titulo:"Agendadas",               itens: ind.filter(s=>s.status==="Agendada")},
    /* Sob foco nao corta: o alerta pode apontar uma sessao de meses atras, e o
       corte em 30 esconderia exatamente a linha que a pessoa veio conferir. */
    {key:"concluidas", titulo: foco ? "Concluídas" : "Concluídas (últimas 30)",
     itens: foco ? ind.filter(s=>s.status==="Concluída") : ind.filter(s=>s.status==="Concluída").slice(0,30)},
    {key:"bloqueadas", titulo:"Bloqueadas",              itens: ind.filter(s=>s.status==="Bloqueada")},
  ];
  const todas1a1 = S.filter(eh1a1);

/* Confirmar em lote exige o mentor, mesma regra da confirmação individual:
   sem isso a sessão entra concluída sem dono e some da contagem por mentor. */
window.confirmarGrupo = async function(){
  const e = grupoAberto; if(!e) return;
  const mentor = $("#gc_mentor") ? $("#gc_mentor").value : "";
  if(!mentor) return toast("Selecione quem atendeu a sessão", true);
  const ids = e.itens.filter(s=>s.status!=="Concluída").map(s=>s.id);
  if(!ids.length) return toast("Nada a confirmar");
  const {error} = await db.from("sessoes").update({status:"Concluída", mentor}).in("id", ids);
  if(error) return toast(error.message, true);
  toast(`${ids.length} presença(s) confirmada(s)`); closeModal(); await loadAll();
}

/* Busca da lista de participantes. Esconde por atributo em vez de re-renderizar
   a lista: o modal guarda as marcacoes so no DOM, e um re-render perderia quem
   ja tinha sido selecionado antes da busca. */
window.filtrarParticipantes = function(q){
  let visiveis = 0;
  document.querySelectorAll("#g_lista .chk").forEach(l=>{
    const casa = casaBusca(q, l.dataset.nome);
    l.hidden = !casa;
    if(casa) visiveis++;
  });
  const btn = document.getElementById("g_btnTodos");
  if(btn) btn.textContent = q.trim() ? `Selecionar visíveis (${visiveis})` : `Selecionar todos (${visiveis})`;
  const vazio = document.getElementById("g_vazio");
  if(vazio) vazio.hidden = visiveis > 0;
}
/* Marcar so alcanca quem esta visivel -- selecionar todos durante uma busca
   incluiria gente que a pessoa nem viu. Limpar, ao contrario, alcanca todos:
   marcacao escondida sobrando entraria no encontro sem ninguem perceber. */
window.marcarTodosGrupo = function(v){
  document.querySelectorAll(".g-part").forEach(c=>{
    const l = c.closest(".chk");
    if(!v || !l || !l.hidden) c.checked = v;
  });
}
window.criarSessaoGrupo = async function(){
  const etapa = $("#g_etapa").value;
  const ids = [...document.querySelectorAll(".g-part:checked")].map(c=>c.value);
  if(!ids.length) return toast("Selecione ao menos um participante", true);
  const base = {
    etapa, ordem: ETAPA_ORD[etapa]||99, status: $("#g_status").value,
    mentor: $("#g_mentor").value||null, data: $("#g_data").value||null, hora: $("#g_hora").value||null,
    link_meet: $("#g_meet").value||null, link_gravacao: $("#g_grav").value||null,
  };
  const {error} = await db.from("sessoes").insert(ids.map(id=>Object.assign({mentorado_id:id}, base)));
  if(error) return toast(error.message, true);
  toast(`Encontro registrado para ${ids.length} participante(s)`);
  closeModal(); await loadAll();
}

/* ================= ROTAS / MARCOS ================= */
let rotaMentoradoId = null;
const MESES_PT = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const RICO_STATUS = ["NAO_INICIADO","EM_ANDAMENTO","BLOQUEADO","AGUARDANDO_VALIDACAO","CONCLUIDO","NAO_APLICAVEL"];
const RICO_LABEL = {CONCLUIDO:"Concluído",EM_ANDAMENTO:"Em andamento",BLOQUEADO:"Bloqueado",
  AGUARDANDO_VALIDACAO:"Aguard. validação",NAO_APLICAVEL:"Não aplicável",NAO_INICIADO:"Não iniciado"};
function pillMarco(status, modelo){
  if(modelo==="simples"){
    if(status==="passou") return `<span class="pill green">Passou</span>`;
    return `<span class="pill gray">Não passou</span>`;
  }
  const map={CONCLUIDO:"green",EM_ANDAMENTO:"blue",BLOQUEADO:"red",AGUARDANDO_VALIDACAO:"amber",NAO_APLICAVEL:"gray",NAO_INICIADO:"gray"};
  return `<span class="pill ${map[status]||"gray"}">${esc(RICO_LABEL[status]||status)}</span>`;
}

/* ---------- teste de passagem ----------
   criterios é [{grupo, itens:[...]}] — uma lista de portões. Só o Marco 01 de
   Marketplace tem dois; nos outros o grupo vem null e vira um bloco único.
   O que fica salvo em mentorado_marcos.criterios_ok é o TEXTO do item, não o
   índice: reescrever o catálogo não pode migrar a marcação de um critério para
   outro sem ninguém perceber. */
function portoesDe(marco){
  const c = marco && marco.criterios;
  if(!Array.isArray(c) || !c.length) return [];
  return c.map(g => ({grupo: g && g.grupo || null, itens: Array.isArray(g && g.itens) ? g.itens : []}))
          .filter(g => g.itens.length);
}
const criteriosDe = marco => portoesDe(marco).flatMap(g => g.itens);
function progressoMarco(marco, mm){
  const total = criteriosDe(marco).length;
  if(!total) return {feitos:0, total:0, pct:null};
  const ok = new Set((mm && mm.criterios_ok) || []);
  const feitos = criteriosDe(marco).filter(c => ok.has(c)).length;
  return {feitos, total, pct: Math.round(feitos/total*100)};
}
/* ---------- painel do marco ----------
   O conteúdo do "Compilado das Rotas Elite 3D" fica embaixo do próprio marco,
   e não num modal: o mentor lê a restrição, a alavanca e os apoios enquanto
   marca o teste de passagem, sem trocar de tela no meio da conversa.
   Um marco aberto por vez — os ids dos campos (mk_*) são únicos na página. */
function painelMarco(marco, mm, rota, mentoradoId, fatRegua, porMes){
  const editar = pode("escreverRotas");
  const isSimples = rota.modelo === "simples";
  const st = (mm && mm.status) || (isSimples ? "nao_passou" : "NAO_INICIADO");
  const portoes = portoesDe(marco);
  const feitos = new Set((mm && mm.criterios_ok) || []);
  const total = criteriosDe(marco).length;
  const jaFeitos = criteriosDe(marco).filter(c=>feitos.has(c)).length;
  const meta = marco.meta_valor != null ? Number(marco.meta_valor) : null;
  const falta = meta != null ? Math.max(0, meta - fatRegua) : null;

  const bloco = (titulo, texto) => texto
    ? `<div><h4>${titulo}</h4><p>${esc(texto)}</p></div>` : "";
  const lista = (titulo, arr) => (arr && arr.length)
    ? `<div><h4>${titulo}</h4><ul>${arr.map(a=>`<li>${esc(a)}</li>`).join("")}</ul></div>` : "";
  const chips = (titulo, arr) => (arr && arr.length)
    ? `<div><h4>${titulo}</h4><div class="mk-chips">${arr.map(a=>`<span class="mk-chip">${esc(a)}</span>`).join("")}</div></div>` : "";

  const contexto = bloco("Restrição", marco.restricao) + bloco("Alavanca", marco.alavanca)
    + bloco("Pergunta-chave", marco.pergunta_chave);

  const criterios = portoes.length ? `<div>
    <h4>Teste de passagem</h4>
    <div class="mk-crits">${portoes.map(g=>
      (g.grupo?`<div class="mk-grupo">${esc(g.grupo)}</div>`:"")
      + g.itens.map(item=>`<label class="chk"><input type="checkbox" class="mk-crit" value="${esc(item)}"${feitos.has(item)?" checked":""}${editar?"":" disabled"} onchange="atualizarProgressoMarco()"><span>${esc(item)}</span></label>`).join("")
    ).join("")}</div>
    <div class="step-prog" style="max-width:none">
      <div class="niv-bar" id="mk_barra"><i style="width:${total?Math.round(jaFeitos/total*100):0}%"></i></div>
      <b id="mk_contador">${jaFeitos} de ${total}</b>
    </div>
  </div>` : "";

  /* A régua de valores é da rota inteira, não do canal aberto. */
  const regua = meta != null ? `<div class="mk-meta">
    <span>${porMes?"Faturamento do mês":"Acumulado na rota"}: <b>${fmtBRL(fatRegua)}</b></span>
    <span>Meta do marco: <b>${fmtBRL(meta)}</b></span>
    <span>${falta>0?`Falta <b>${fmtBRL(falta)}</b>`:`<b>Meta atingida</b>`}</span>
  </div>` : "";

  const registro = `<div>
    <h4>Registro do mentor</h4>
    <div class="mk-grid">
      <div class="f"><label>Status</label><select id="mk_status"${editar?"":" disabled"}>
        ${(isSimples?["nao_passou","passou"]:RICO_STATUS).map(s=>`<option value="${s}"${st===s?" selected":""}>${esc(isSimples?(s==="passou"?"Passou":"Não passou"):RICO_LABEL[s])}</option>`).join("")}
      </select></div>
      <div class="f"><label>Data de conclusão</label>${dateField("mk_data", mm&&mm.data, {disabled:!editar})}</div>
    </div>
    ${isSimples?"":`<div class="mk-grid" style="margin-top:12px">
      <div class="f"><label>Próxima ação</label><input id="mk_acao" value="${esc(mm&&mm.proxima_acao)}" placeholder="a ação concreta até a próxima sessão"${editar?"":" disabled"}></div>
      <div class="f"><label>Bloqueios (um por linha)</label><textarea id="mk_bloq" rows="2"${editar?"":" disabled"}>${esc(((mm&&mm.bloqueios)||[]).join("\n"))}</textarea></div>
    </div>`}
    ${editar?`<div class="mk-acoes" style="margin-top:14px">
      <button class="btn sm" onclick="salvarMarco('${marco.id}','${mentoradoId}')">Salvar evolução</button>
      <span class="step-data">Os critérios pendentes e o progresso saem do teste de passagem.</span>
    </div>`:""}
  </div>`;

  return `<div class="step-panel">
    ${marco.subtitulo?`<p>${esc(marco.subtitulo)}</p>`:""}
    ${regua}
    ${contexto?`<div class="mk-grid">${contexto}</div>`:""}
    ${lista("Apoios", marco.apoios)}
    ${chips("Indicadores", marco.indicadores)}
    ${criterios}
    ${registro}
  </div>`;
}
function ultimosMeses(n){
  const out=[]; const d=new Date();
  d.setDate(1);
  for(let i=0;i<n;i++){ out.unshift(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`); d.setMonth(d.getMonth()-1); }
  return out;
}

  const dadosFatChart = meses.map(mes => registrosFat.filter(f=>f.mes.slice(0,7)===mes).reduce((a,f)=>a+Number(f.valor),0));
  const registrosFatOrdenados = applySort(registrosFat, "rota_fat", {
